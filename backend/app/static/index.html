<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeM ProcureShield AI — Official Government e-Marketplace Intelligence Engine</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f4f7fb;
      color: #1e293b;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    
    .gem-tricolor-bar {
      background: linear-gradient(90deg, #FF9933 0%, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #138808 66.6%, #138808 100%);
      height: 4px;
    }
    
    .gem-header-gradient {
      background: linear-gradient(135deg, #0a1e3f 0%, #0d2859 60%, #103474 100%);
    }

    .bms-badge-red {
      background-color: #f84464;
      color: #ffffff;
    }

    .bms-pill-active {
      background-color: #0b2559;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(11, 37, 89, 0.25);
    }
    
    .card-hover-lift {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-900 selection:text-white">
  
  <!-- Tricolor National Stripe -->
  <div class="gem-tricolor-bar"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // Core Data States
      const [bidders, setBidders] = useState([]);
      const [selectedId, setSelectedId] = useState('BID-2026-0891');
      const [metrics, setMetrics] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [entityGraph, setEntityGraph] = useState(null);
      
      // UI View / Drawer States
      const [activeTab, setActiveTab] = useState('overview'); // overview, vault, graph, rules
      const [isAuditOpen, setIsAuditOpen] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [loading, setLoading] = useState(true);
      const [verifying, setVerifying] = useState(false);
      const [notification, setNotification] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      // Constraint Filters
      const [filterMinTrust, setFilterMinTrust] = useState(300);
      const [filterMsmeOnly, setFilterMsmeOnly] = useState(false);
      const [filterMinTurnover, setFilterMinTurnover] = useState(0);
      const [filterExcludeConflicts, setFilterExcludeConflicts] = useState(false);

      // AI Chat State
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'ai',
          text: 'Namaste Officer! I am your GeM ProcureShield AI Assistant. I have indexed all uploaded documents, GSTN/MCA21 master registers, CIBIL-style Trust metrics, and cross-bidder entity linkages for Tender #GEM/2026/B/89420.\n\nHow may I assist your Technical Evaluation Committee today?'
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      // Officer Decision State
      const [actionType, setActionType] = useState('APPROVE');
      const [officerNotes, setOfficerNotes] = useState('');
      const [overrideJustification, setOverrideJustification] = useState('');

      const showNotice = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4500);
      };

      const loadData = async () => {
        try {
          setLoading(true);
          const [bRes, mRes, aRes, gRes] = await Promise.all([
            fetch('/api/bidders').then(r => r.json()),
            fetch('/api/metrics').then(r => r.json()),
            fetch('/api/audit').then(r => r.json()),
            fetch('/api/graph/tender/GEM/2026/B/89420').then(r => r.json())
          ]);
          setBidders(bRes);
          setMetrics(mRes);
          setAuditLogs(aRes);
          setEntityGraph(gRes);
          if (bRes.length > 0 && !selectedId) setSelectedId(bRes[0].bidder_id);
        } catch (e) {
          console.error('Data load error:', e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const handleReverify = async () => {
        if (!selectedId) return;
        setVerifying(true);
        try {
          await fetch(`/api/bidders/verify/${selectedId}`, { method: 'POST' });
          await loadData();
          showNotice(`10-Step Automated Verification Completed for ${selectedId}!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifying(false);
        }
      };

      const handleReset = async () => {
        setLoading(true);
        try {
          await fetch('/api/bidders/reset-demo', { method: 'POST' });
          await loadData();
          showNotice('Demo Data & 5-Layer Intelligence Engine Reset Successfully!');
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handleDecisionSubmit = async (e) => {
        e.preventDefault();
        if (!officerNotes.trim()) return;
        setVerifying(true);
        try {
          await fetch('/api/officer/decision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bidder_id: selectedId,
              action: actionType,
              officer_id: 'OFFICER-GEM-994',
              officer_name: 'Rajesh Kumar (Senior Procurement Director)',
              comments: officerNotes,
              override_justification: overrideJustification
            })
          });
          setOfficerNotes('');
          setOverrideJustification('');
          await loadData();
          showNotice(`Decision (${actionType}) recorded & signed on CAG Audit Trail!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifying(false);
        }
      };

      const handleSendChat = async (e) => {
        if (e) e.preventDefault();
        if (!chatInput.trim() || chatLoading) return;

        const userMsg = chatInput;
        setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat/officer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: userMsg,
              tender_id: 'GEM/2026/B/89420',
              active_bidder_id: selectedId
            })
          });
          const data = await res.json();
          setChatMessages(prev => [...prev, {
            sender: 'ai',
            text: data.reply,
            context: data.context_used,
            suggested: data.suggested_actions
          }]);
        } catch (err) {
          setChatMessages(prev => [...prev, {
            sender: 'ai',
            text: 'I encountered an error analyzing the tender query. Please check your connection and retry.'
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      // Filtered & Searched Bidders
      const filteredBidders = useMemo(() => {
        return bidders.filter(b => {
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = b.company_name.toLowerCase().includes(q);
            const matchId = b.bidder_id.toLowerCase().includes(q);
            const matchGst = b.identifiers.gstin.toLowerCase().includes(q);
            if (!matchName && !matchId && !matchGst) return false;
          }
          const trust = b.longitudinal_trust_score?.score ?? 0;
          if (trust < filterMinTrust) return false;
          if (filterMsmeOnly && !b.identifiers.udyam_registration_number) return false;
          if (filterMinTurnover > 0 && b.financials.annual_turnover_inr < filterMinTurnover) return false;
          if (filterExcludeConflicts && b.conflict_links_count > 0) return false;
          return true;
        });
      }, [bidders, searchQuery, filterMinTrust, filterMsmeOnly, filterMinTurnover, filterExcludeConflicts]);

      const cur = bidders.find(b => b.bidder_id === selectedId) || bidders[0];

      return (
        <div className="min-h-screen flex flex-col bg-[#F4F7FB]">
          
          {/* GeM Official Top Utility Header */}
          <div className="bg-[#06152B] text-slate-300 text-[11px] font-medium px-4 py-1.5 border-b border-slate-800">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="flex items-center space-x-1.5">
                  <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-white font-semibold">Government of India</span>
                </span>
                <span className="text-slate-500">•</span>
                <span>Ministry of Commerce & Industry</span>
                <span className="text-slate-500">•</span>
                <span className="text-amber-400 font-semibold">GeM AI Intelligence Cell</span>
              </div>
              <div className="flex items-center space-x-4">
                <span className="font-mono text-slate-300">NIC / API Setu / MCA21 Online</span>
                <span className="text-slate-500">|</span>
                <span className="text-slate-200">Security Grade: <strong className="text-emerald-400">CERT-In Compliant</strong></span>
              </div>
            </div>
          </div>

          {/* Main GeM + BookMyShow Style Navbar */}
          <header className="gem-header-gradient text-white sticky top-0 z-40 px-4 py-3 shadow-lg border-b border-blue-900/60">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* Brand Logo & Title */}
              <div className="flex items-center space-x-3.5">
                <div className="w-10 h-10 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center shadow-inner">
                  <span className="text-2xl">🏛️</span>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-extrabold text-xl tracking-tight text-white flex items-center gap-1.5">
                      GeM <span className="text-[#FF9933]">Procure</span><span className="text-[#38BDF8]">Shield</span>
                    </h1>
                    <span className="px-2 py-0.5 text-[10px] font-bold bg-[#F84464] text-white rounded-full uppercase tracking-wider shadow-sm">
                      AI v2.0
                    </span>
                  </div>
                  <p className="text-xs text-blue-200/80 font-medium">
                    Tender #GEM/2026/B/89420 • Enterprise Cloud & Defense Infrastructure
                  </p>
                </div>
              </div>

              {/* BookMyShow-style Live Search & Quick Filter */}
              <div className="hidden md:flex flex-1 max-w-md mx-4">
                <div className="relative w-full">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">
                    🔍
                  </span>
                  <input
                    type="text"
                    placeholder="Search by Vendor Name, GSTIN, or Bidder ID..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-1.5 bg-white/10 border border-white/20 rounded-xl text-xs text-white placeholder-blue-200/60 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white/15 transition"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 text-xs hover:text-white">
                      ✕
                    </button>
                  )}
                </div>
              </div>

              {/* Header Action Buttons */}
              <div className="flex items-center space-x-2.5">
                
                {/* AI Assistant Button */}
                <button
                  onClick={() => setIsChatOpen(true)}
                  className="px-3.5 py-2 text-xs font-bold bg-[#F84464] hover:bg-[#d93b57] text-white rounded-xl shadow-md transition flex items-center space-x-1.5 card-hover-lift"
                >
                  <span>💬 AI Assistant</span>
                  <span className="w-2 h-2 rounded-full bg-white animate-ping"></span>
                </button>

                {/* Filter Drawer Toggle */}
                <button
                  onClick={() => setIsFilterOpen(!isFilterOpen)}
                  className={`px-3 py-2 text-xs font-bold rounded-xl border transition flex items-center space-x-1.5 ${
                    isFilterOpen ? 'bg-amber-500 text-slate-950 border-amber-400 font-extrabold' : 'bg-white/10 hover:bg-white/20 text-white border-white/20'
                  }`}
                >
                  <span>🎛️ Filters</span>
                  <span className="px-1.5 py-0.2 text-[10px] bg-black/30 rounded-full font-mono">
                    {filteredBidders.length}
                  </span>
                </button>

                {/* CAG Audit Log Modal */}
                <button
                  onClick={() => setIsAuditOpen(true)}
                  className="hidden sm:flex items-center space-x-1.5 px-3 py-2 text-xs font-bold bg-white/10 hover:bg-white/20 text-white rounded-xl border border-white/20 transition"
                >
                  <span>📜 CAG Audit</span>
                  <span className="px-1.5 py-0.2 text-[10px] bg-blue-900/80 rounded-full font-mono">
                    {auditLogs.length}
                  </span>
                </button>

                {/* Reset Data */}
                <button
                  onClick={handleReset}
                  disabled={loading}
                  className="p-2 text-xs bg-white/10 hover:bg-white/20 text-white rounded-xl border border-white/20 transition"
                  title="Reset Demo Scenarios"
                >
                  🔄
                </button>

              </div>
            </div>
          </header>

          {/* Floating Success Toast */}
          {notification && (
            <div className="fixed top-20 right-6 z-50 bg-[#0B2559] border-2 border-amber-400 text-white px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center space-x-3 animate-bounce">
              <span className="text-lg">🛡️</span>
              <span>{notification}</span>
            </div>
          )}

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
            
            {/* Tender Header Summary Card (GeM Official Style) */}
            <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div className="space-y-1">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="px-2.5 py-1 text-[10px] font-bold bg-blue-100 text-blue-800 rounded-md font-mono">
                    BID NO: GEM/2026/B/89420
                  </span>
                  <span className="px-2.5 py-1 text-[10px] font-bold bg-emerald-100 text-emerald-800 rounded-md">
                    STATUS: TECHNICAL EVALUATION
                  </span>
                  <span className="px-2.5 py-1 text-[10px] font-bold bg-purple-100 text-purple-800 rounded-md">
                    2-COVER BID
                  </span>
                </div>
                <h2 className="text-base font-bold text-slate-800">
                  Procurement of Scalable Multi-Region Cloud Infrastructure & AI Defense Analytics Framework
                </h2>
                <p className="text-xs text-slate-500">
                  Buyer Ministry: <strong className="text-slate-700">Ministry of Defense / Indian Air Force</strong> • Total Sanctioned Value: <strong className="text-emerald-600">₹14.50 Crores</strong>
                </p>
              </div>

              <div className="flex items-center gap-3">
                <div className="text-right">
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Evaluation Mode</span>
                  <span className="text-xs font-extrabold text-[#0B2559] bg-blue-50 px-3 py-1 rounded-lg border border-blue-200 inline-block mt-0.5">
                    ⚡ 10-Step AI Automated
                  </span>
                </div>
              </div>
            </div>

            {/* BookMyShow Style Quick Metric Ribbon */}
            {metrics && (
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3.5">
                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm border-t-4 border-t-blue-700">
                  <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Total Bidders</p>
                  <p className="text-2xl font-black text-slate-800 mt-1">{metrics.total_bidders}</p>
                  <p className="text-[10px] text-slate-400 mt-0.5">All Dossiers Ingested</p>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm border-t-4 border-t-emerald-500">
                  <p className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider">Compliant (Pass)</p>
                  <p className="text-2xl font-black text-emerald-600 mt-1">{metrics.compliant_count}</p>
                  <p className="text-[10px] text-slate-400 mt-0.5">100% Statutory Clear</p>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm border-t-4 border-t-amber-500">
                  <p className="text-[11px] font-bold text-amber-600 uppercase tracking-wider">Discrepancy Flags</p>
                  <p className="text-2xl font-black text-amber-600 mt-1">{metrics.flagged_count}</p>
                  <p className="text-[10px] text-slate-400 mt-0.5">Officer Review Req.</p>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm border-t-4 border-t-rose-500">
                  <p className="text-[11px] font-bold text-[#F84464] uppercase tracking-wider">Debarred / Risk</p>
                  <p className="text-2xl font-black text-[#F84464] mt-1">{metrics.debarred_count}</p>
                  <p className="text-[10px] text-slate-400 mt-0.5">Shell / Debarment Link</p>
                </div>

                <div className="col-span-2 sm:col-span-1 bg-gradient-to-br from-[#0A1E3F] to-[#103474] p-4 rounded-2xl text-white shadow-sm">
                  <p className="text-[11px] font-bold text-amber-400 uppercase tracking-wider">Pipeline Speed</p>
                  <p className="text-xl font-black font-mono mt-1 text-white">{metrics.automated_verification_time_sec}s</p>
                  <p className="text-[10px] text-blue-200 mt-0.5">Manual: 4.5 Business Days</p>
                </div>
              </div>
            )}

            {/* Officer Constraint Filter Panel (Expandable) */}
            {isFilterOpen && (
              <div className="bg-white rounded-2xl p-5 border-2 border-blue-200 shadow-lg space-y-4 animate-fadeIn">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <span className="text-base">🎛️</span>
                    <h3 className="text-xs font-black text-[#0B2559] uppercase tracking-wider">
                      Officer Evaluation & Constraint Rules Engine
                    </h3>
                  </div>
                  <button
                    onClick={() => {
                      setFilterMinTrust(300);
                      setFilterMsmeOnly(false);
                      setFilterMinTurnover(0);
                      setFilterExcludeConflicts(false);
                      setSearchQuery('');
                    }}
                    className="text-xs text-blue-600 hover:text-blue-800 font-semibold"
                  >
                    Reset All Filters
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 text-xs">
                  <div className="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <label className="text-slate-700 font-bold block">
                      Min CIBIL Trust Score: <strong className="text-blue-700 font-mono text-sm">{filterMinTrust}</strong>
                    </label>
                    <input
                      type="range"
                      min="300"
                      max="900"
                      step="50"
                      value={filterMinTrust}
                      onChange={e => setFilterMinTrust(Number(e.target.value))}
                      className="w-full accent-[#0B2559] cursor-pointer"
                    />
                    <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                      <span>300 (Subprime)</span>
                      <span>900 (Prime AAA)</span>
                    </div>
                  </div>

                  <div className="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <label className="text-slate-700 font-bold block">Minimum Annual Turnover:</label>
                    <select
                      value={filterMinTurnover}
                      onChange={e => setFilterMinTurnover(Number(e.target.value))}
                      className="w-full bg-white border border-slate-300 rounded-lg p-2 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600"
                    >
                      <option value="0">All Turnovers</option>
                      <option value="20000000">₹2.0+ Cr (Tender Min)</option>
                      <option value="50000000">₹5.0+ Cr (High Capacity)</option>
                    </select>
                  </div>

                  <div className="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <input
                      type="checkbox"
                      id="msmeCheck"
                      checked={filterMsmeOnly}
                      onChange={e => setFilterMsmeOnly(e.target.checked)}
                      className="w-5 h-5 rounded accent-blue-700 cursor-pointer"
                    />
                    <label htmlFor="msmeCheck" className="text-slate-700 font-bold cursor-pointer leading-tight">
                      MSME Preference Quota Only
                      <span className="block text-[10px] font-normal text-slate-500">Public Procurement Policy 2012</span>
                    </label>
                  </div>

                  <div className="flex items-center space-x-3 bg-rose-50/60 p-3 rounded-xl border border-rose-200">
                    <input
                      type="checkbox"
                      id="conflictCheck"
                      checked={filterExcludeConflicts}
                      onChange={e => setFilterExcludeConflicts(e.target.checked)}
                      className="w-5 h-5 rounded accent-rose-600 cursor-pointer"
                    />
                    <label htmlFor="conflictCheck" className="text-rose-900 font-bold cursor-pointer leading-tight">
                      Exclude Entity Risk Links
                      <span className="block text-[10px] font-normal text-rose-600">Zero tolerance for shell links</span>
                    </label>
                  </div>
                </div>
              </div>
            )}

            {/* BookMyShow Style "Show/Bidder Selector" Deck */}
            <div className="space-y-3">
              <div className="flex justify-between items-center px-1">
                <div>
                  <h3 className="text-sm font-extrabold text-slate-800 uppercase tracking-wider flex items-center gap-2">
                    <span>🏢 Participating Bidder Dossiers</span>
                    <span className="px-2 py-0.5 text-xs bg-slate-200 text-slate-700 rounded-full font-bold">
                      {filteredBidders.length}
                    </span>
                  </h3>
                  <p className="text-xs text-slate-500">Select a bidder card to inspect verification certificates, trust history & risk map</p>
                </div>
                <span className="text-xs font-semibold text-slate-400">Click card to load cockpit</span>
              </div>

              {/* 3-Card Responsive Grid (BookMyShow Movie Card Style) */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {filteredBidders.map(b => {
                  const isSel = b.bidder_id === selectedId;
                  const score = b.compliance_score?.score ?? 0;
                  const risk = b.compliance_score?.risk_level ?? 'LOW';
                  const trust = b.longitudinal_trust_score?.score ?? 0;
                  const band = b.longitudinal_trust_score?.rating_band?.split(' ')[0] ?? '';
                  const hasConflict = b.conflict_links_count > 0;

                  return (
                    <div
                      key={b.bidder_id}
                      onClick={() => setSelectedId(b.bidder_id)}
                      className={`relative bg-white rounded-2xl p-5 cursor-pointer border-2 transition-all card-hover-lift shadow-sm ${

                        </svg>
                      </div>

                      <div className="p-4 bg-rose-50 border border-rose-200 rounded-xl text-xs space-y-1">
                        <span className="font-extrabold text-rose-900 uppercase text-[10px] tracking-wider block">
                          🚨 Graph Intelligence Synthesis:
                        </span>
                        <p className="text-slate-700">
                          {entityGraph?.risk_summary}
                        </p>
                      </div>
                    </div>
                  )}

                  {/* Tab 4: Deterministic Rules Engine */}
                  {activeTab === 'rules' && (
                    <div className="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm space-y-3">
                      <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                        <span className="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Deterministic YAML Rule Evaluator</span>
                        <span className="text-[10px] bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded font-mono font-bold">100% Explainable</span>
                      </div>

                      {cur.rule_results?.map(r => (
                        <div key={r.rule_id} className={`p-4 rounded-xl border text-xs flex justify-between items-start ${
                          r.passed ? 'bg-slate-50 border-slate-200' : 'bg-rose-50 border-rose-200'
                        }`}>
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-extrabold text-slate-800">{r.passed ? '✅' : '❌'} {r.rule_name}</span>
                              {r.is_hard_block && <span className="text-[9px] bg-rose-100 text-rose-800 border border-rose-300 px-2 py-0.2 rounded uppercase font-bold">Hard Gate</span>}
                            </div>
                            <p className="text-xs font-mono text-slate-500 mt-1">Condition: {r.expected_condition} | Evaluated: {String(r.actual_value)}</p>
                            {!r.passed && <p className="text-rose-700 font-semibold mt-1">⚠️ {r.failure_reason}</p>}
                          </div>
                          <span className={`px-2.5 py-0.5 text-[10px] font-extrabold rounded uppercase ${
                            r.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                          }`}>
                            {r.passed ? 'PASS' : 'FAIL'}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Step 9: Human-in-the-Loop Procurement Officer Determination Panel */}
                <div className="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="text-sm font-extrabold text-slate-800 uppercase tracking-wider">Procurement Officer Determination & Signature</h3>
                      <p className="text-xs text-slate-500">Step 9: Human-in-the-Loop decision workflow</p>
                    </div>
                    <span className="text-xs bg-blue-100 text-blue-900 px-3 py-1 rounded-full font-bold font-mono">
                      Current Dossier: {cur.officer_status}
                    </span>
                  </div>

                  <form onSubmit={handleDecisionSubmit} className="space-y-4">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                      {[
                        { id: 'APPROVE', label: '✅ Approve Tenderer', color: 'emerald' },
                        { id: 'REJECT', label: '❌ Disqualify / Reject', color: 'rose' },
                        { id: 'REQUEST_INFO', label: '❓ Seek Clarification', color: 'amber' },
                        { id: 'OVERRIDE', label: '⚠️ Override with Justification', color: 'purple' }
                      ].map(act => (
                        <button
                          key={act.id}
                          type="button"
                          onClick={() => setActionType(act.id)}
                          className={`p-3 rounded-xl border text-xs font-bold transition card-hover-lift ${
                            actionType === act.id
                              ? 'bg-[#0B2559] text-white border-[#0B2559] shadow-md'
                              : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                          }`}
                        >
                          {act.label}
                        </button>
                      ))}
                    </div>

                    {actionType === 'OVERRIDE' && (
                      <input
                        type="text"
                        required
                        placeholder="Mandatory CAG / CVC Audit Justification for rule override..."
                        value={overrideJustification}
                        onChange={e => setOverrideJustification(e.target.value)}
                        className="w-full bg-purple-50 border border-purple-300 rounded-xl p-3 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-purple-600"
                      />
                    )}

                    <textarea
                      required
                      rows={2}
                      placeholder="Enter officer technical evaluation remarks..."
                      value={officerNotes}
                      onChange={e => setOfficerNotes(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 resize-none focus:outline-none focus:ring-2 focus:ring-blue-600"
                    />

                    <div className="flex justify-between items-center pt-2">
                      <span className="text-xs text-slate-500 font-mono">Digital Signature: <strong>Rajesh Kumar (Senior Director, GeM)</strong></span>
                      <button
                        type="submit"
                        disabled={verifying || !officerNotes.trim()}
                        className="px-6 py-2.5 bg-[#F84464] hover:bg-[#d93b57] text-white text-xs font-bold rounded-xl shadow-md disabled:opacity-50 card-hover-lift"
                      >
                        Commit Decision & Notarize CAG Log
                      </button>
                    </div>
                  </form>
                </div>

              </div>
            )}
          </main>

          {/* AI Officer Chat Assistant Drawer (BookMyShow / Modern Slide-over) */}
          {isChatOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-xl bg-white h-full flex flex-col shadow-2xl border-l border-slate-200 animate-slideLeft">
                
                {/* Chat Drawer Header */}
                <div className="p-4 bg-[#0B2559] text-white flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <span className="text-2xl">🤖</span>
                    <div>
                      <h3 className="text-sm font-extrabold uppercase">GeM AI Intelligence Officer Assistant</h3>
                      <p className="text-[11px] text-blue-200">Cross-bidder comparative analysis & GFR 2017 advisory</p>
                    </div>
                  </div>
                  <button onClick={() => setIsChatOpen(false)} className="text-white hover:text-amber-400 font-bold text-lg p-1">✕</button>
                </div>

                {/* Chat Messages */}
                <div className="flex-1 p-5 overflow-y-auto space-y-4 bg-[#F8FAFC]">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div className={`p-4 rounded-2xl max-w-[90%] text-xs leading-relaxed ${
                        msg.sender === 'user'
                          ? 'bg-[#0B2559] text-white rounded-br-none shadow-sm'
                          : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none shadow-sm'
                      }`}>
                        <div className="whitespace-pre-wrap">{msg.text}</div>

                        {msg.suggested && (
                          <div className="mt-3.5 pt-2.5 border-t border-slate-200 space-y-1.5">
                            <span className="text-[10px] text-slate-500 uppercase font-bold block">Recommended Prompts:</span>
                            {msg.suggested.map((s, i) => (
                              <button
                                key={i}
                                onClick={() => { setChatInput(s); }}
                                className="block text-left text-xs text-blue-700 hover:text-blue-900 font-medium"
                              >
                                → {s}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                  {chatLoading && (
                    <div className="text-xs text-slate-500 flex items-center space-x-2 p-3 bg-white rounded-xl border border-slate-200 w-fit">
                      <span className="animate-spin">⚡</span>
                      <span>AI Engine is parsing tender dossiers & registers...</span>
                    </div>
                  )}
                </div>

                {/* Chat Input */}
                <form onSubmit={handleSendChat} className="p-3.5 bg-white border-t border-slate-200 flex gap-2">
                  <input
                    type="text"
                    placeholder="Ask about cartel risks, CIBIL scores, turnover, or GFR rules..."
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    className="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600"
                  />
                  <button
                    type="submit"
                    disabled={chatLoading || !chatInput.trim()}
                    className="px-5 py-2.5 bg-[#F84464] hover:bg-[#d93b57] text-white text-xs font-bold rounded-xl disabled:opacity-50 shadow-sm"
                  >
                    Send
                  </button>
                </form>

              </div>
            </div>
          )}

          {/* CAG Audit Trail Modal */}
          {isAuditOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-xl bg-white h-full p-6 overflow-y-auto space-y-4 border-l border-slate-200 shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <div>
                    <span className="font-black text-slate-800 text-sm uppercase">📜 GFR 2017 & CAG Compliance Audit Trail</span>
                    <p className="text-xs text-slate-500">Immutable SHA-256 state tracking for every decision</p>
                  </div>
                  <button onClick={() => setIsAuditOpen(false)} className="text-slate-400 hover:text-slate-800 font-bold text-lg">✕</button>
                </div>
                <div className="space-y-3">
                  {auditLogs.map(l => (
                    <div key={l.log_id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-1.5">
                      <div className="flex justify-between font-bold text-slate-700">
                        <span className="text-[#0B2559]">{l.actor}</span>
                        <span className="text-slate-400 font-mono text-[11px]">{new Date(l.timestamp).toLocaleTimeString()}</span>
                      </div>
                      <p className="font-extrabold text-slate-900">{l.step}: {l.action_type}</p>
                      {l.notes && <p className="text-blue-900 bg-blue-50 p-2 rounded-lg border border-blue-100 font-medium">📝 {l.notes}</p>}
                      <pre className="text-[11px] font-mono text-slate-600 bg-white p-2.5 rounded-lg border border-slate-200 overflow-x-auto">
                        {JSON.stringify(l.details, null, 2)}
                      </pre>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Official Footer */}
          <footer className="bg-[#0A1E3F] text-slate-400 text-xs py-6 border-t border-slate-800 mt-12">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-2">
                <span className="text-lg">🇮🇳</span>
                <span>Government e-Marketplace (GeM) • ProcureShield AI Defense Engine</span>
              </div>
              <div className="flex items-center space-x-4 text-[11px]">
                <span>GFR 2017 Verified</span>
                <span>•</span>
                <span>CVC Guidelines Adherent</span>
                <span>•</span>
                <span>CAG Audit Ready</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
