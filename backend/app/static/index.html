<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeM — Government e-Marketplace | ProcureShield AI Intelligence Cockpit</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Markdown renderer for AI chat responses -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .gem-tricolor-bar {
      background: linear-gradient(90deg, #FF9933 0%, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #138808 66.6%, #138808 100%);
      height: 4px;
    }
    
    /* Warm Vibrant Government Saffron / Orange Gradient */
    .gem-header-gradient {
      background: linear-gradient(135deg, #EA580C 0%, #D9480F 45%, #C2410C 80%, #9A3412 100%);
    }

    .card-hover-lift {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px rgba(234, 88, 12, 0.12);
    }

    .bms-pill-active {
      background-color: #EA580C;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
    }

    @keyframes pulseSlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-slow {
      animation: pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Markdown prose styles for AI chat messages */
    .prose h1,.prose h2,.prose h3 { font-weight:700; margin:8px 0 4px; color:#1e293b; }
    .prose h1 { font-size:15px; }
    .prose h2 { font-size:13px; }
    .prose h3 { font-size:12px; }
    .prose strong { font-weight:700; color:#1e293b; }
    .prose em { font-style:italic; }
    .prose ul { list-style:disc; padding-left:16px; margin:6px 0; }
    .prose ol { list-style:decimal; padding-left:16px; margin:6px 0; }
    .prose li { margin:2px 0; }
    .prose p { margin:4px 0; }
    .prose code { background:#f1f5f9; border-radius:3px; padding:1px 4px; font-family:monospace; font-size:11px; }
    .prose pre { background:#f1f5f9; border-radius:6px; padding:8px; overflow-x:auto; margin:6px 0; }
    .prose table { border-collapse:collapse; width:100%; margin:8px 0; }
    .prose th { background:#f8fafc; border:1px solid #e2e8f0; padding:4px 8px; font-weight:700; font-size:11px; }
    .prose td { border:1px solid #e2e8f0; padding:4px 8px; font-size:11px; }
    .prose hr { border:none; border-top:1px solid #e2e8f0; margin:8px 0; }
    .prose a { color:#EA580C; text-decoration:underline; }
    .prose blockquote { border-left:3px solid #EA580C; padding-left:10px; color:#64748b; margin:6px 0; }

    @media print {
      body { background-color: #ffffff !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-orange-600 selection:text-white">
  
  <!-- Tricolor National Stripe -->
  <div class="gem-tricolor-bar no-print"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Interactive SVG Cartel & Entity Linkage Graph Component
    function InteractiveEntityGraph({ entityGraph, tenderId, activeBidderId }) {
      const [selectedNode, setSelectedNode] = useState(null);
      const [filterConflictOnly, setFilterConflictOnly] = useState(false);

      if (!entityGraph || !entityGraph.nodes || entityGraph.nodes.length === 0) {
        return (
          <div className="p-8 text-center text-slate-400 bg-slate-50 rounded-2xl border border-slate-200">
            <span className="text-3xl block mb-2">🕸️</span>
            <p className="font-bold text-xs">Loading Entity Linkage Network Graph...</p>
          </div>
        );
      }

      const width = 760;
      const height = 440;
      const centerX = width / 2;
      const centerY = height / 2;

      const nodesWithPos = useMemo(() => {
        const nodes = entityGraph.nodes;
        const bidders = nodes.filter(n => n.type === 'BIDDER');
        const directors = nodes.filter(n => n.type === 'DIRECTOR');
        const addresses = nodes.filter(n => n.type === 'ADDRESS');
        const others = nodes.filter(n => n.type !== 'BIDDER' && n.type !== 'DIRECTOR' && n.type !== 'ADDRESS');

        const map = {};
        
        bidders.forEach((n, i) => {
          const angle = (i / Math.max(1, bidders.length)) * Math.PI + Math.PI / 2;
          map[n.id] = {
            ...n,
            x: centerX + Math.cos(angle) * 220,
            y: centerY + Math.sin(angle) * 150
          };
        });

        directors.forEach((n, i) => {
          const angle = (i / Math.max(1, directors.length)) * 2 * Math.PI;
          map[n.id] = {
            ...n,
            x: centerX + Math.cos(angle) * 110,
            y: centerY + Math.sin(angle) * 80
          };
        });

        addresses.forEach((n, i) => {
          const angle = (i / Math.max(1, addresses.length)) * Math.PI - Math.PI / 2;
          map[n.id] = {
            ...n,
            x: centerX + Math.cos(angle) * 230 + 40,
            y: centerY + Math.sin(angle) * 140
          };
        });

        others.forEach((n, i) => {
          map[n.id] = {
            ...n,
            x: centerX + (i % 2 === 0 ? 160 : -160),
            y: centerY + (i % 2 === 0 ? 140 : -130)
          };
        });

        return map;
      }, [entityGraph]);

      const visibleEdges = useMemo(() => {
        return entityGraph.edges.filter(e => {
          if (filterConflictOnly && !e.is_conflict) return false;
          return nodesWithPos[e.source] && nodesWithPos[e.target];
        });
      }, [entityGraph, filterConflictOnly, nodesWithPos]);

      const getNodeColor = (node) => {
        if (node.risk_level === 'CRITICAL') return { fill: '#FEE2E2', stroke: '#EF4444', text: '#991B1B', badge: 'bg-rose-100 text-rose-800' };
        if (node.risk_level === 'HIGH') return { fill: '#FFEDD5', stroke: '#F97316', text: '#9A3412', badge: 'bg-orange-100 text-orange-800' };
        if (node.risk_level === 'MEDIUM') return { fill: '#FEF3C7', stroke: '#F59E0B', text: '#92400E', badge: 'bg-amber-100 text-amber-800' };
        return { fill: '#DCFCE7', stroke: '#22C55E', text: '#166534', badge: 'bg-emerald-100 text-emerald-800' };
      };

      const getNodeIcon = (type) => {
        switch (type) {
          case 'BIDDER': return '🏢';
          case 'DIRECTOR': return '👤';
          case 'ADDRESS': return '📍';
          case 'DEBARRED_ENTITY': return '🚫';
          case 'BANK_BRANCH': return '🏦';
          default: return '🔗';
        }
      };

      return (
        <div className="bg-slate-900 rounded-3xl p-5 text-white space-y-4 border border-slate-800 shadow-xl">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-3 border-b border-slate-800 gap-2">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-xl">🕸️</span>
                <h4 className="text-sm font-extrabold uppercase tracking-wide text-white">
                  Interactive Cartel & Entity Linkage Graph ({tenderId})
                </h4>
              </div>
              <p className="text-[11px] text-slate-400 mt-0.5">
                Maps cross-bidder directors (DIN), shared premises, bank branch linkages, and CPPP debarment networks.
              </p>
            </div>

            <div className="flex items-center space-x-2 text-xs">
              <label className="flex items-center space-x-1.5 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-amber-400 font-bold cursor-pointer">
                <input
                  type="checkbox"
                  checked={filterConflictOnly}
                  onChange={e => setFilterConflictOnly(e.target.checked)}
                  className="rounded accent-amber-500"
                />
                <span>Show Conflicts & Cartels Only</span>
              </label>
            </div>
          </div>

          <div className="relative bg-slate-950/80 rounded-2xl border border-slate-800 p-2 overflow-hidden flex justify-center">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto max-h-[460px] select-none">
              <defs>
                <marker id="arrow-clean" markerWidth="8" markerHeight="8" refX="16" refY="4" orient="auto">
                  <path d="M 0 0 L 8 4 L 0 8 z" fill="#10B981" />
                </marker>
                <marker id="arrow-conflict" markerWidth="8" markerHeight="8" refX="16" refY="4" orient="auto">
                  <path d="M 0 0 L 8 4 L 0 8 z" fill="#EF4444" />
                </marker>
              </defs>

              {visibleEdges.map((edge, i) => {
                const s = nodesWithPos[edge.source];
                const t = nodesWithPos[edge.target];
                if (!s || !t) return null;
                const isSelected = selectedNode && (selectedNode.id === edge.source || selectedNode.id === edge.target);

                return (
                  <g key={i}>
                    <line
                      x1={s.x}
                      y1={s.y}
                      x2={t.x}
                      y2={t.y}
                      stroke={edge.is_conflict ? '#EF4444' : '#10B981'}
                      strokeWidth={isSelected ? 3 : (edge.is_conflict ? 2 : 1.2)}
                      strokeDasharray={edge.is_conflict ? '4 3' : 'none'}
                      opacity={isSelected ? 1 : 0.7}
                      markerEnd={edge.is_conflict ? 'url(#arrow-conflict)' : 'url(#arrow-clean)'}
                    />
                    <text
                      x={(s.x + t.x) / 2}
                      y={(s.y + t.y) / 2 - 4}
                      fill={edge.is_conflict ? '#FCA5A5' : '#6EE7B7'}
                      fontSize="8"
                      fontWeight="bold"
                      textAnchor="middle"
                      className="font-mono bg-slate-900"
                    >
                      {edge.relationship.replace(/_/g, ' ')}
                    </text>
                  </g>
                );
              })}

              {Object.values(nodesWithPos).map((node) => {
                const colors = getNodeColor(node);
                const isSelected = selectedNode?.id === node.id;
                const isMatchActive = activeBidderId && (node.id === activeBidderId || node.details?.bidder_id === activeBidderId);

                return (
                  <g
                    key={node.id}
                    transform={`translate(${node.x}, ${node.y})`}
                    onClick={() => setSelectedNode(selectedNode?.id === node.id ? null : node)}
                    className="cursor-pointer transition-all hover:scale-110"
                  >
                    <circle
                      r={node.type === 'BIDDER' ? 22 : 17}
                      fill={colors.fill}
                      stroke={isMatchActive ? '#F97316' : colors.stroke}
                      strokeWidth={isMatchActive ? 4 : (isSelected ? 3 : 2)}
                      className={node.risk_level === 'CRITICAL' ? 'animate-pulse' : ''}
                    />
                    <text
                      textAnchor="middle"
                      dy="5"
                      fontSize={node.type === 'BIDDER' ? '15' : '12'}
                    >
                      {getNodeIcon(node.type)}
                    </text>
                    <text
                      y={node.type === 'BIDDER' ? 34 : 28}
                      textAnchor="middle"
                      fill="#E2E8F0"
                      fontSize="9"
                      fontWeight="bold"
                      className="font-sans"
                    >
                      {node.label.length > 20 ? node.label.substring(0, 18) + '…' : node.label}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
            <div className="md:col-span-2 bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 text-xs space-y-1.5">
              <span className="text-[10px] font-bold text-orange-400 uppercase tracking-wider block">
                Node Inspector (Click any node above to inspect)
              </span>
              {selectedNode ? (
                <div className="space-y-1">
                  <div className="flex items-center space-x-2">
                    <span className="text-base">{getNodeIcon(selectedNode.type)}</span>
                    <strong className="text-white text-sm">{selectedNode.label}</strong>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${getNodeColor(selectedNode).badge}`}>
                      {selectedNode.risk_level} RISK
                    </span>
                  </div>
                  <p className="text-slate-300 font-mono text-[11px]">Type: {selectedNode.type} • ID: {selectedNode.id}</p>
                  {selectedNode.details && (
                    <div className="text-[11px] text-slate-400 font-mono">
                      {Object.entries(selectedNode.details).map(([k, v]) => (
                        <span key={k} className="mr-3">{k}: <strong className="text-slate-200">{String(v)}</strong></span>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                <p className="text-slate-400 italic">Click on any vendor, director, or address node above to view interconnected linkages and cartel findings.</p>
              )}
            </div>

            <div className="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 text-xs space-y-2">
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Network Legend</span>
              <div className="grid grid-cols-2 gap-1.5 text-[11px]">
                <span className="flex items-center space-x-1.5"><span className="text-sm">🏢</span><span>Bidder</span></span>
                <span className="flex items-center space-x-1.5"><span className="text-sm">👤</span><span>Director (DIN)</span></span>
                <span className="flex items-center space-x-1.5"><span className="text-sm">📍</span><span>Registered Premise</span></span>
                <span className="flex items-center space-x-1.5"><span className="text-sm">🚫</span><span>Debarred Entity</span></span>
              </div>
              <div className="pt-2 border-t border-slate-700 flex justify-between text-[10px] font-mono">
                <span className="text-emerald-400">─ Green: Clean Link</span>
                <span className="text-rose-400">--- Red: Cartel / Debarred</span>
              </div>
            </div>
          </div>

          <div className="p-3 bg-rose-950/60 border border-rose-800 rounded-2xl text-xs flex items-start space-x-2 text-rose-200">
            <span className="text-base flex-shrink-0">🚨</span>
            <div>
              <strong className="text-rose-400 uppercase text-[10px] block">Entity Linkage Intelligence Summary:</strong>
              <span>{entityGraph.risk_summary}</span>
            </div>
          </div>
        </div>
      );
    }

    function App() {

      // ── DEMO OFFICER CREDENTIALS ─────────────────────────────────────────────
      const OFFICERS = {
        'officer001': { password: 'GeM@2026', name: 'Rajesh Kumar Sharma', rank: 'Senior Procurement Officer', ministry: 'Ministry of Defence', badge: 'IAS-2018-RK' },
        'officer002': { password: 'Shield@123', name: 'Priya Nair', rank: 'Deputy Secretary', ministry: 'Ministry of Finance', badge: 'IRS-2016-PN' },
        'officer003': { password: 'Procure@456', name: 'Arjun Mehta', rank: 'Joint Commissioner', ministry: 'Ministry of Railways', badge: 'IRAS-2019-AM' },
        'admin':      { password: 'Admin@2026', name: 'System Administrator', rank: 'System Admin', ministry: 'GeM PMU', badge: 'ADMIN-001' },
      };

      // ── LOGIN STATE ──────────────────────────────────────────────────────────
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentOfficer, setCurrentOfficer] = useState(null);
      const [loginUserId, setLoginUserId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);
      const [showPassword, setShowPassword] = useState(false);

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginLoading(true);
        setLoginError('');
        setTimeout(() => {
          const officer = OFFICERS[loginUserId.trim().toLowerCase()];
          if (officer && officer.password === loginPassword) {
            setCurrentOfficer({ userId: loginUserId, ...officer });
            setIsLoggedIn(true);
          } else {
            setLoginError('Invalid User ID or Password. Please try again.');
          }
          setLoginLoading(false);
        }, 800); // simulate auth check
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setCurrentOfficer(null);
        setLoginUserId('');
        setLoginPassword('');
        setLoginError('');
      };

      // Show login screen if not authenticated
      // Show login screen if not authenticated
      if (!isLoggedIn) {
        return (
          <div
            className="min-h-screen flex items-center justify-center p-4 relative"
            style={{
              backgroundColor: '#f5e4e2',
              backgroundImage: `url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALkAAABBCAYAAACNbAUoAAACNElEQVR4AezYUU7DMBBFUYf9LxIWwXeIS6WAxEfkJHQ8cyBGEYrdefddVZS3z4/31cIgswNvzRcCyQmQPHnB4rVGchakJ0Dy9BULSPIQDhjiTgIkv5Ous0MQIHmIGgxxJwGS30nX2SEIkDxEDYa4kwDJ76Tr7BAEDkseYlpDIDBAgOQD0GyZiwDJ5+rLtAMESD4AzZa5CJB8rr5MO0CA5APQXrjFSw8QIPkANFvmIkDyufoy7QABkg9As2UuAiSfqy/TDhAg+QA0W+YicL3kc+U3bQECJC9QcvWIJK9uQIH8JC9QcvWIJK9uQIH8JE9aslg7AZLvLNwlJUDypMWKtRMg+c7CXVICJE9arFg7AZLvLNwlJfBCyZMSFSscAZKHq8RAVxMg+dVEnReOAMnDVWKgqwmQ/GqizgtHgOThKvnngQq8HMkLlFw9IsmrG1AgP8kLlFw9IsmrG1AgP8kLlFw94gySV+9I/MESH4SoO3xCZA8fkcmPEmA5CcB2h6fAMnjd2TCkwRIfhJgne3zJiX5vN2Z/CABkh8E5bF5CZB83u5MfpAAyQ+C8tg8BJb2+5vk83Rn0qME1u3BHyuV5Fs0FwIbgeWx1mVp63ZL8g2HKx+BLndr/e28NZLn67d8onXpcvfVUawk7xisXAS65I/lnTxXsdL8QWD5/p0/V745+HkdgXAnkTxcJQa6mgDJrybqvDAEHp8/t2lIvkFwJSTw/OdKF53kCfutHqmL/fzM+UDxBQAA//+gjKLVAAAABklEQVQDAOLJxG5R9hEHAAAAAElFTkSuQmCC'), url('/login-bg.png')`,
              backgroundRepeat: 'repeat',
              backgroundSize: 'auto'
            }}
          >
            {/* Subtle soft backdrop layer */}
            <div className="absolute inset-0 bg-white/20 backdrop-blur-[1px]"></div>

            <div className="relative w-full max-w-md my-6">
              {/* Logo / Header */}
              <div className="text-center mb-6">
                <div className="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl border border-orange-200/80 mb-3 shadow-md">
                  <span className="text-3xl">🛡️</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight flex items-center justify-center gap-1.5">
                  GeM <span className="text-orange-600">Procure</span><span>Shield</span> AI
                </h1>
                <p className="text-slate-600 text-xs font-semibold mt-1">Vendor Verification & Compliance Intelligence Cockpit</p>
                <div className="mt-2.5 inline-flex items-center px-3 py-1 bg-white/90 rounded-full border border-orange-200 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                  <span className="text-[11px] text-slate-800 font-bold">Government of India — Official Portal</span>
                </div>
              </div>

              {/* Login Card */}
              <div className="bg-white/95 backdrop-blur-md rounded-3xl shadow-xl border border-orange-100 overflow-hidden">
                <div className="bg-gradient-to-r from-orange-600 to-amber-600 px-8 py-4 text-white">
                  <h2 className="font-bold text-base">Officer Authentication</h2>
                  <p className="text-orange-100 text-xs mt-0.5">Enter your official GeM credentials to access the cockpit</p>
                </div>

                <form onSubmit={handleLogin} className="p-7 space-y-4">
                  {/* User ID */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Officer User ID</label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base">👤</span>
                      <input
                        type="text"
                        value={loginUserId}
                        onChange={e => setLoginUserId(e.target.value)}
                        placeholder="e.g. officer001"
                        className="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent bg-slate-50 font-medium"
                        required
                        autoFocus
                      />
                    </div>
                  </div>

                  {/* Password */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Password</label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base">🔒</span>
                      <input
                        type={showPassword ? 'text' : 'password'}
                        value={loginPassword}
                        onChange={e => setLoginPassword(e.target.value)}
                        placeholder="Enter password"
                        className="w-full pl-10 pr-11 py-2.5 border border-slate-300 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent bg-slate-50 font-medium"
                        required
                      />
                      <button type="button" onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm">
                        {showPassword ? '🙈' : '👁️'}
                      </button>
                    </div>
                  </div>

                  {/* Error message */}
                  {loginError && (
                    <div className="flex items-center gap-2 bg-red-50 border border-red-200 rounded-xl px-3.5 py-2.5">
                      <span className="text-red-500 text-sm">⚠️</span>
                      <span className="text-red-700 text-xs font-medium">{loginError}</span>
                    </div>
                  )}

                  {/* Login Button */}
                  <button
                    type="submit"

                    <p className="text-sm font-bold text-slate-800">{forensicFile ? forensicFile.name : 'Select or Drop any Certificate Image'}</p>
                    <div className="flex justify-center gap-3">
                      <button onClick={() => fileInputRef.current?.click()} className="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl border">
                        📂 Browse File...
                      </button>
                      <button onClick={handleRunLiveForensicScan} disabled={!forensicFile || forensicUploading} className="px-5 py-2 bg-[#F84464] text-white text-xs font-bold rounded-xl shadow disabled:opacity-50">
                        {forensicUploading ? '⚡ Analyzing...' : '⚡ Run ELA Scan'}
                      </button>
                    </div>
                  </div>

                  {liveForensicResult && (
                    <div className="bg-white p-4 rounded-2xl border space-y-3">
                      <div className="flex justify-between items-center">
                        <h4 className="font-extrabold text-slate-900 text-sm">{liveForensicResult.file_name}</h4>
                        <span className="text-xs font-black px-3 py-1 rounded-full bg-slate-100 font-mono">
                          {liveForensicResult.status} ({liveForensicResult.overall_tamper_score}/100)
                        </span>
                      </div>
                      {liveForensicResult.ela_heatmap_base64 && (
                        <div className="bg-slate-900 rounded-xl p-2 flex justify-center">
                          <img src={liveForensicResult.ela_heatmap_base64} alt="ELA" className="max-h-64 object-contain rounded" />
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="p-4 bg-slate-100 border-t text-right">
                  <button onClick={() => setIsForensicLabOpen(false)} className="px-5 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold rounded-xl">
                    Close Lab
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AI CHAT ASSISTANT DRAWER */}
          {isChatOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex justify-end no-print">
              <div className="w-full max-w-xl bg-white h-full flex flex-col shadow-2xl border-l border-slate-200 animate-slideLeft">
                <div className="p-4 bg-orange-600 text-white flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <span className="text-2xl">🤖</span>
                    <div>
                      <h3 className="text-sm font-extrabold uppercase">GeM AI Intelligence Officer Assistant</h3>
                      <p className="text-[11px] text-orange-100">Multi-Vendor Reasoning & GFR 2017 Guidance</p>
                    </div>
                  </div>
                  <button onClick={() => setIsChatOpen(false)} className="text-white hover:text-amber-200 font-bold text-lg p-1">✕</button>
                </div>

                <div className="flex-1 p-5 overflow-y-auto space-y-4 bg-[#F8FAFC]">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div className={`p-4 rounded-2xl max-w-[92%] text-xs leading-relaxed ${
                        msg.sender === 'user'
                          ? 'bg-orange-600 text-white rounded-br-none shadow-sm'
                          : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none shadow-sm'
                      }`}>
                        {msg.sender === 'ai' ? (
                          <div
                            className="prose prose-xs max-w-none text-slate-800"
                            style={{fontSize:'12px',lineHeight:'1.6'}}
                            dangerouslySetInnerHTML={{ __html: typeof marked !== 'undefined' ? marked.parse(msg.text || '') : msg.text }}
                          />
                        ) : (
                          <div className="whitespace-pre-wrap">{msg.text}</div>
                        )}
                        {msg.suggested && (
                          <div className="mt-3 pt-2 border-t border-slate-200 space-y-1">
                            <span className="text-[10px] text-slate-500 uppercase font-bold block">Suggestions:</span>
                            {msg.suggested.map((s, i) => (
                              <button key={i} onClick={() => setChatInput(s)} className="block text-left text-xs text-orange-700 hover:text-orange-900 font-semibold">
                                → {s}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                  {chatLoading && (
                    <div className="flex items-start">
                      <div className="bg-white border border-slate-200 rounded-2xl rounded-bl-none shadow-sm px-4 py-3 flex items-center space-x-1">
                        <span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:'#EA580C',animation:'typingBounce 1.2s infinite',animationDelay:'0s'}}></span>
                        <span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:'#EA580C',animation:'typingBounce 1.2s infinite',animationDelay:'0.2s'}}></span>
                        <span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:'#EA580C',animation:'typingBounce 1.2s infinite',animationDelay:'0.4s'}}></span>
                      </div>
                    </div>
                  )}
                  <div ref={chatBottomRef}></div>
                </div>

                <form onSubmit={handleSendChat} className="p-4 bg-white border-t border-slate-200 flex gap-2">
                  <input
                    type="text"
                    placeholder="Ask me anything — 'hi', 'list vendors', 'who is disqualified?'..."
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    className="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-orange-500"
                  />
                  <button type="submit" disabled={chatLoading || !chatInput.trim()} className="px-5 py-2 bg-[#F84464] text-white text-xs font-bold rounded-xl">
                    Send
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* CAG Audit Log Modal */}
          {isAuditOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex justify-end no-print">
              <div className="w-full max-w-xl bg-white h-full p-6 overflow-y-auto space-y-4 border-l border-slate-200 shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <span className="font-black text-slate-800 text-sm uppercase">📜 CAG Compliance Audit Trail</span>
                  <button onClick={() => setIsAuditOpen(false)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>
                <div className="space-y-3">
                  {auditLogs.map(l => (
                    <div key={l.log_id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-1">
                      <div className="flex justify-between font-bold text-slate-700">
                        <span className="text-orange-700">{l.actor}</span>
                        <span className="text-slate-400 font-mono text-[11px]">{new Date(l.timestamp).toLocaleTimeString()}</span>
                      </div>
                      <p className="font-extrabold text-slate-900">{l.step}: {l.action_type}</p>
                      {l.notes && <p className="text-orange-950 bg-orange-50 p-2 rounded-lg border border-orange-200 font-medium">📝 {l.notes}</p>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#18110D] text-amber-200/60 text-xs py-6 border-t border-orange-950 mt-12 no-print">
            <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
              <span>🇮🇳 Government e-Marketplace (GeM) • ProcureShield AI</span>
              <span className="text-[11px]">GFR 2017 Verified • L1/L2/L3 Contingency Active • CAG Audit Ready</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
