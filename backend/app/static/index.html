<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProcureShield AI — Next-Gen GeM Verification & Intelligence Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React, Babel, and Tailwind plugins -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // Core Data States
      const [bidders, setBidders] = useState([]);
      const [selectedId, setSelectedId] = useState('BID-2026-0891');
      const [metrics, setMetrics] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [entityGraph, setEntityGraph] = useState(null);
      
      // UI View / Drawer States
      const [activeTab, setActiveTab] = useState('overview'); // overview, vault, graph, rules, diff
      const [isAuditOpen, setIsAuditOpen] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [loading, setLoading] = useState(true);
      const [verifying, setVerifying] = useState(false);
      const [notification, setNotification] = useState(null);

      // Feature 4: Officer Constraint Filters
      const [filterMinTrust, setFilterMinTrust] = useState(300);
      const [filterMsmeOnly, setFilterMsmeOnly] = useState(false);
      const [filterMinTurnover, setFilterMinTurnover] = useState(0);
      const [filterExcludeConflicts, setFilterExcludeConflicts] = useState(false);

      // Feature 5: AI Chat State
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'ai',
          text: 'Hello Officer! I have analyzed all bidders, document vaults, trust score histories, and entity graph topologies for Tender #GEM/2026/B/89420. How can I assist your Technical Evaluation Committee today?'
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      // Officer Decision State
      const [actionType, setActionType] = useState('APPROVE');
      const [officerNotes, setOfficerNotes] = useState('');
      const [overrideJustification, setOverrideJustification] = useState('');

      const showNotice = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4000);
      };

      const loadData = async () => {
        try {
          setLoading(true);
          const [bRes, mRes, aRes, gRes] = await Promise.all([
            fetch('/api/bidders').then(r => r.json()),
            fetch('/api/metrics').then(r => r.json()),
            fetch('/api/audit').then(r => r.json()),
            fetch('/api/graph/tender/GEM/2026/B/89420').then(r => r.json())
          ]);
          setBidders(bRes);
          setMetrics(mRes);
          setAuditLogs(aRes);
          setEntityGraph(gRes);
          if (bRes.length > 0 && !selectedId) setSelectedId(bRes[0].bidder_id);
        } catch (e) {
          console.error('Data load error:', e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const handleReverify = async () => {
        if (!selectedId) return;
        setVerifying(true);
        try {
          await fetch(`/api/bidders/verify/${selectedId}`, { method: 'POST' });
          await loadData();
          showNotice(`10-step verification completed for ${selectedId}!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifying(false);
        }
      };

      const handleReset = async () => {
        setLoading(true);
        try {
          await fetch('/api/bidders/reset-demo', { method: 'POST' });
          await loadData();
          showNotice('Demo scenarios reset & all 5 features synchronized!');
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handleDecisionSubmit = async (e) => {
        e.preventDefault();
        if (!officerNotes.trim()) return;
        setVerifying(true);
        try {
          await fetch('/api/officer/decision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bidder_id: selectedId,
              action: actionType,
              officer_id: 'OFFICER-GEM-994',
              officer_name: 'Rajesh Kumar (Senior Procurement Officer)',
              comments: officerNotes,
              override_justification: overrideJustification
            })
          });
          setOfficerNotes('');
          setOverrideJustification('');
          await loadData();
          showNotice(`Decision (${actionType}) recorded & committed to CAG Audit Trail!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifying(false);
        }
      };

      const handleSendChat = async (e) => {
        if (e) e.preventDefault();
        if (!chatInput.trim() || chatLoading) return;

        const userMsg = chatInput;
        setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat/officer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: userMsg,
              tender_id: 'GEM/2026/B/89420',
              active_bidder_id: selectedId
            })
          });
          const data = await res.json();
          setChatMessages(prev => [...prev, {
            sender: 'ai',
            text: data.reply,
            context: data.context_used,
            suggested: data.suggested_actions
          }]);
        } catch (err) {
          setChatMessages(prev => [...prev, {
            sender: 'ai',
            text: 'I encountered an error analyzing the tender query. Please try again.'
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      // Filtered Bidders based on Feature 4 Constraint Filter
      const filteredBidders = useMemo(() => {
        return bidders.filter(b => {
          const trust = b.longitudinal_trust_score?.score ?? 0;
          if (trust < filterMinTrust) return false;
          if (filterMsmeOnly && !b.identifiers.udyam_registration_number) return false;
          if (filterMinTurnover > 0 && b.financials.annual_turnover_inr < filterMinTurnover) return false;
          if (filterExcludeConflicts && b.conflict_links_count > 0) return false;
          return true;
        });
      }, [bidders, filterMinTrust, filterMsmeOnly, filterMinTurnover, filterExcludeConflicts]);

      const cur = bidders.find(b => b.bidder_id === selectedId) || bidders[0];

      return (
        <div className="min-h-screen flex flex-col bg-slate-950">
          
          {/* Top Executive Navbar */}
          <header className="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 backdrop-blur-md">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600/20 border border-blue-500/40 rounded-xl text-blue-400 font-black text-xl shadow-inner">
                  🛡️
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-lg text-white tracking-tight">ProcureShield<span className="text-blue-400">AI</span></span>
                    <span className="px-2 py-0.5 text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full">
                      v2.0 ENTERPRISE
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 font-mono">Tender #GEM/2026/B/89420 • Cloud Infra & Cyber Services</p>
                </div>
              </div>

              {/* 1-Click Scenario Switcher */}
              <div className="hidden lg:flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 space-x-1 shadow-inner">
                <span className="text-[10px] font-bold text-slate-500 px-2 uppercase tracking-wider">Dossiers:</span>
                {bidders.map(b => {
                  const isSel = b.bidder_id === selectedId;
                  const isLow = b.compliance_score?.risk_level === 'LOW';
                  const isCrit = b.compliance_score?.risk_level === 'CRITICAL';
                  const dot = isLow ? '🟢' : isCrit ? '🔴' : '🟡';
                  return (
                    <button
                      key={b.bidder_id}
                      onClick={() => setSelectedId(b.bidder_id)}
                      className={`px-3 py-1 text-xs font-semibold rounded-lg transition-all ${
                        isSel ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800/80'
                      }`}
                    >
                      {dot} {b.company_name.split(' ')[0]}
                    </button>
                  );
                })}
              </div>

              {/* Header Action Controls */}
              <div className="flex items-center space-x-2">
                {/* Feature 5: AI Chat Toggle */}
                <button
                  onClick={() => setIsChatOpen(true)}
                  className="px-3 py-1.5 text-xs font-bold bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 rounded-xl border border-indigo-500/40 transition flex items-center space-x-1.5 shadow-sm"
                >
                  <span>💬 AI Assistant</span>
                  <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                </button>

                {/* Feature 4: Filter Toggle */}
                <button
                  onClick={() => setIsFilterOpen(!isFilterOpen)}
                  className={`px-3 py-1.5 text-xs font-bold rounded-xl border transition flex items-center space-x-1 ${
                    isFilterOpen ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                  }`}
                >
                  <span>🎛️ Filter ({filteredBidders.length}/{bidders.length})</span>
                </button>

                {/* Audit Trail Modal Toggle */}
                <button
                  onClick={() => setIsAuditOpen(true)}
                  className="hidden sm:flex items-center space-x-1 px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition"
                >
                  <span>📜 CAG Audit ({auditLogs.length})</span>
                </button>

                {/* Reset Demo Button */}
                <button
                  onClick={handleReset}
                  disabled={loading}
                  className="px-2.5 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition"
                  title="Reset Demo Data"
                >
                  🔄
                </button>
              </div>

            </div>
          </header>

          {/* Floating Notice */}
          {notification && (
            <div className="fixed top-20 right-6 z-50 bg-blue-600 border border-blue-400 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold flex items-center space-x-2 animate-bounce">
              <span>✅ {notification}</span>
            </div>
          )}

          {/* Main Layout Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
            
            {/* KPI Metric Cards */}
            {metrics && (
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                <div className="glass-panel p-3.5 rounded-2xl">
                  <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Bidders</p>
                  <p className="text-2xl font-black text-white">{metrics.total_bidders}</p>
                </div>
                <div className="glass-panel p-3.5 rounded-2xl">
                  <p className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Fully Compliant</p>
                  <p className="text-2xl font-black text-emerald-400">{metrics.compliant_count}</p>
                </div>
                <div className="glass-panel p-3.5 rounded-2xl">
                  <p className="text-[10px] font-bold text-amber-400 uppercase tracking-wider">Discrepancy Flags</p>
                  <p className="text-2xl font-black text-amber-400">{metrics.flagged_count}</p>
                </div>
                <div className="glass-panel p-3.5 rounded-2xl">
                  <p className="text-[10px] font-bold text-rose-400 uppercase tracking-wider">Debarred / Blocked</p>
                  <p className="text-2xl font-black text-rose-400">{metrics.debarred_count}</p>
                </div>
                <div className="col-span-2 md:col-span-1 bg-gradient-to-br from-blue-950/60 to-indigo-950/60 border border-blue-700/40 p-3.5 rounded-2xl">
                  <p className="text-[10px] font-bold text-blue-300 uppercase tracking-wider">Verification Speed</p>
                  <p className="text-base font-black text-white font-mono">{metrics.automated_verification_time_sec}s <span className="text-xs text-slate-400 font-normal">vs 4.5d</span></p>
                </div>
              </div>
            )}

            {/* Feature 4: Officer Review Checkbox & Constraint Filtering Drawer */}
            {isFilterOpen && (
              <div className="glass-panel p-4 rounded-2xl space-y-3 border-blue-500/40 shadow-xl animate-fadeIn">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <span className="text-xs font-black text-blue-400 uppercase tracking-wider">
                    🎛️ Officer Evaluation Constraint Filter Panel
                  </span>
                  <button
                    onClick={() => {
                      setFilterMinTrust(300);
                      setFilterMsmeOnly(false);
                      setFilterMinTurnover(0);
                      setFilterExcludeConflicts(false);
                    }}
                    className="text-[11px] text-slate-400 hover:text-white"
                  >
                    Reset Filters
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 text-xs">
                  {/* Trust Score Slider */}
                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold block">
                      Min CIBIL Trust Score: <span className="text-blue-400 font-mono">{filterMinTrust}</span>
                    </label>
                    <input
                      type="range"
                      min="300"
                      max="900"
                      step="50"
                      value={filterMinTrust}
                      onChange={e => setFilterMinTrust(Number(e.target.value))}
                      className="w-full accent-blue-500 cursor-pointer"
                    />
                  </div>

                  {/* Turnover Threshold */}
                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold block">Minimum Turnover:</label>
                    <select
                      value={filterMinTurnover}
                      onChange={e => setFilterMinTurnover(Number(e.target.value))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-white"
                    >
                      <option value="0">All Turnovers</option>
                      <option value="20000000">₹2.0+ Cr (Tender Min)</option>
                      <option value="50000000">₹5.0+ Cr</option>
                    </select>
                  </div>

                  {/* MSME Quota Checkbox */}
                  <div className="flex items-center space-x-2 pt-4">
                    <input
                      type="checkbox"
                      id="msmeCheck"
                      checked={filterMsmeOnly}
                      onChange={e => setFilterMsmeOnly(e.target.checked)}
                      className="w-4 h-4 rounded accent-blue-600 cursor-pointer"
                    />
                    <label htmlFor="msmeCheck" className="text-slate-300 font-medium cursor-pointer">
                      MSME Reservation Only
                    </label>
                  </div>

                  {/* Exclude Cartel / Conflict Checkbox */}
                  <div className="flex items-center space-x-2 pt-4">
                    <input
                      type="checkbox"
                      id="conflictCheck"
                      checked={filterExcludeConflicts}
                      onChange={e => setFilterExcludeConflicts(e.target.checked)}
                      className="w-4 h-4 rounded accent-rose-600 cursor-pointer"
                    />
                    <label htmlFor="conflictCheck" className="text-rose-300 font-medium cursor-pointer">
                      Exclude Entity Risk Links
                    </label>
                  </div>
                </div>
              </div>
            )}

            {/* Bidders Queue Table */}
            <div className="glass-panel rounded-2xl overflow-hidden shadow">
              <div className="p-3 bg-slate-950/80 border-b border-slate-800 flex justify-between items-center text-xs font-bold text-slate-300">
                <span>ACTIVE BIDDERS DOSSIER QUEUE ({filteredBidders.length} Displayed)</span>
                <span className="text-[10px] text-slate-500 font-mono">Select a vendor below to inspect complete records</span>
              </div>
              <div className="divide-y divide-slate-800">
                {filteredBidders.map(b => {
                  const isSel = b.bidder_id === selectedId;
                  const score = b.compliance_score?.score ?? 0;
                  const risk = b.compliance_score?.risk_level ?? 'LOW';
                  const trust = b.longitudinal_trust_score?.score ?? 0;
                  const band = b.longitudinal_trust_score?.rating_band?.split(' ')[0] ?? '';

                  return (
                    <div
                      key={b.bidder_id}
                      onClick={() => setSelectedId(b.bidder_id)}
                      className={`p-3.5 flex items-center justify-between cursor-pointer transition ${
                        isSel ? 'bg-blue-950/40 border-l-4 border-blue-500' : 'hover:bg-slate-900/60 bg-slate-950/40'
                      }`}
                    >
                      <div className="flex items-start space-x-3">
                        <div className="p-2.5 bg-slate-800/80 text-slate-300 rounded-xl mt-0.5">
                          🏢
                        </div>
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="font-bold text-white text-sm">{b.company_name}</span>
                            <span className="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-400 font-mono rounded">{b.bidder_id}</span>
                            {b.conflict_links_count > 0 && (
                              <span className="text-[9px] px-1.5 py-0.5 bg-rose-500/20 text-rose-300 rounded font-bold uppercase">
                                ⚠️ {b.conflict_links_count} Entity Links
                              </span>
                            )}
                          </div>
                          <div className="text-xs text-slate-400 font-mono mt-1 space-x-3">
                            <span>GST: <strong className="text-slate-300">{b.identifiers.gstin}</strong></span>
                            <span>PAN: <strong className="text-slate-300">{b.identifiers.pan}</strong></span>
                            <span>Turnover: <strong className="text-emerald-400">₹{(b.financials.annual_turnover_inr/10000000).toFixed(2)} Cr</strong></span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center space-x-5">
                        {/* Longitudinal CIBIL Trust Score Badge */}
                        <div className="text-right">
                          <span className="text-[10px] text-slate-400 block uppercase">Trust Score</span>
                          <span className="text-sm font-black font-mono text-blue-400">{trust} <span className="text-[10px] text-slate-400 font-normal">({band})</span></span>
                        </div>

                        {/* Statutory Compliance Score */}
                        <div className="text-right">
                          <span className="text-[10px] text-slate-400 block uppercase">Compliance</span>
                          <span className="text-sm font-black font-mono text-white">{score} <span className="text-[10px] text-slate-400">/ 100</span></span>
                          <span className={`ml-1.5 text-[9px] font-bold px-1.5 py-0.5 rounded ${
                            risk === 'LOW' ? 'bg-emerald-500/20 text-emerald-300' :
                            risk === 'CRITICAL' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'
                          }`}>{risk}</span>
                        </div>

                        <span className="text-xs font-bold bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">
                          {b.officer_status}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Selected Vendor Cockpit */}
            {cur && (
              <div className="space-y-6">
                
                {/* Vendor Dossier Header */}
                <div className="glass-panel p-5 rounded-2xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 shadow-xl">
                  <div>
                    <div className="flex flex-wrap items-center gap-2">
                      <h2 className="text-xl font-extrabold text-white">{cur.company_name}</h2>
                      <span className="text-xs px-2.5 py-0.5 bg-blue-500/20 text-blue-300 rounded-full font-semibold">{cur.legal_structure}</span>
                      <span className="text-xs px-2.5 py-0.5 bg-slate-800 text-slate-300 rounded font-mono border border-slate-700">{cur.bidder_id}</span>
                    </div>
                    <p className="text-xs text-slate-400 font-mono mt-1">
                      Registered Address: {cur.registered_address} • Bank Branch: {cur.bank_branch_code}
                    </p>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button
                      onClick={handleReverify}
                      disabled={verifying}
                      className="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition shadow-md disabled:opacity-50 flex items-center space-x-1.5"
                    >
                      <span>{verifying ? '⚡ Evaluating Pipeline...' : '⚡ Re-Run Verification Engine'}</span>
                    </button>
                  </div>
                </div>

                {/* High-Level Score Cards: Dual Gauge (Compliance + CIBIL Trust Score) + AI Officer Card */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  
                  {/* Gauge 1: Statutory Compliance Index (0-100) */}
                  <div className="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center text-center">
                    <span className="text-xs font-bold uppercase text-slate-400 mb-2">Statutory Compliance Index</span>
                    <div className="w-28 h-28 rounded-full border-4 border-blue-500/40 flex flex-col items-center justify-center bg-slate-950 shadow-inner">
                      <span className="text-3xl font-black text-white font-mono">{cur.compliance_score?.score}</span>
                      <span className="text-[10px] text-slate-400 uppercase">/ 100</span>
                    </div>
                    <span className={`mt-3 text-xs font-bold px-3 py-1 rounded-full uppercase ${
                      cur.compliance_score?.risk_level === 'LOW' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' :
                      cur.compliance_score?.risk_level === 'CRITICAL' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' :
                      'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                    }`}>
                      {cur.compliance_score?.risk_level} RISK
                    </span>
                  </div>

                  {/* Feature 2: Longitudinal Trust Score (CIBIL-Style 300-900) */}
                  <div className="glass-panel rounded-2xl p-5 flex flex-col justify-between space-y-3">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <span className="text-xs font-bold uppercase text-blue-400">📈 Longitudinal Trust Index</span>
                      <span className="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-mono font-bold">
                        CIBIL-STYLE
                      </span>
                    </div>

                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-3xl font-black text-white font-mono">
                          {cur.longitudinal_trust_score?.score}
                        </span>
                        <span className="text-xs text-slate-400 font-mono"> / 900</span>
                        <p className="text-[11px] font-bold text-blue-300 mt-0.5">
                          {cur.longitudinal_trust_score?.rating_band}
                        </p>
                      </div>

                      <div className="text-right text-[11px] font-mono space-y-1 text-slate-400">
                        <p>SLA Rate: <strong className="text-emerald-400">{cur.longitudinal_trust_score?.delivery_sla_rate}%</strong></p>
                        <p>GeM Rating: <strong className="text-amber-400">★ {cur.longitudinal_trust_score?.gem_rating}</strong></p>

          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
