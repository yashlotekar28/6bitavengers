<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProcureShield AI — GeM Bidder Verification & Compliance Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [bidders, setBidders] = useState([]);
      const [selectedId, setSelectedId] = useState('BID-2026-0891');
      const [metrics, setMetrics] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [isAuditOpen, setIsAuditOpen] = useState(false);
      const [loading, setLoading] = useState(true);
      const [verifying, setVerifying] = useState(false);
      const [notification, setNotification] = useState(null);

      const [actionType, setActionType] = useState('APPROVE');
      const [officerNotes, setOfficerNotes] = useState('');
      const [overrideJustification, setOverrideJustification] = useState('');
      const [activeTab, setActiveTab] = useState('overview');

      const showNotice = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4000);
      };

      const loadData = async () => {
        try {
          setLoading(true);
          const [bRes, mRes, aRes] = await Promise.all([
            fetch('/api/bidders').then(r => r.json()),
            fetch('/api/metrics').then(r => r.json()),
            fetch('/api/audit').then(r => r.json())
          ]);
          setBidders(bRes);
          setMetrics(mRes);
          setAuditLogs(aRes);
          if (bRes.length > 0 && !selectedId) setSelectedId(bRes[0].bidder_id);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const handleReverify = async () => {
        if (!selectedId) return;
        setVerifying(true);
        try {
          await fetch(`/api/bidders/verify/${selectedId}`, { method: 'POST' });
          await loadData();
          showNotice(`Verification successfully re-executed for ${selectedId}!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifying(false);
        }
      };

      const handleReset = async () => {
        setLoading(true);
        try {
          await fetch('/api/bidders/reset-demo', { method: 'POST' });
          await loadData();
          showNotice('Demo scenarios reset & re-verified!');
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handleDecisionSubmit = async (e) => {
        e.preventDefault();
        if (!officerNotes.trim()) return;
        setVerifying(true);
        try {
          await fetch('/api/officer/decision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bidder_id: selectedId,
              action: actionType,
              officer_id: 'OFFICER-GEM-994',
              officer_name: 'Rajesh Kumar (Senior Procurement Officer)',
              comments: officerNotes,
              override_justification: overrideJustification
            })
          });
          setOfficerNotes('');
          setOverrideJustification('');
          await loadData();
          showNotice(`Decision (${actionType}) recorded & committed to CAG Audit Trail!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifying(false);
        }
      };

      const cur = bidders.find(b => b.bidder_id === selectedId) || bidders[0];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600/20 border border-blue-500/30 rounded-lg text-blue-400 font-black text-xl">
                  🛡️
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-lg text-white tracking-tight">ProcureShield<span className="text-blue-400">AI</span></span>
                    <span className="px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded">
                      GeM 10-STEP ENGINE
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 font-mono">Tender #GEM/2026/B/89420 • Cloud Infrastructure Procurement</p>
                </div>
              </div>

              {/* 1-Click Scenario Switcher */}
              <div className="hidden md:flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 space-x-1">
                <span className="text-[10px] font-medium text-slate-500 px-2 uppercase">Demo Scenarios:</span>
                {bidders.map(b => {
                  const isSel = b.bidder_id === selectedId;
                  const isLow = b.compliance_score?.risk_level === 'LOW';
                  const isCrit = b.compliance_score?.risk_level === 'CRITICAL';
                  const dot = isLow ? '🟢' : isCrit ? '🔴' : '🟡';
                  return (
                    <button
                      key={b.bidder_id}
                      onClick={() => setSelectedId(b.bidder_id)}
                      className={`px-3 py-1 text-xs font-semibold rounded-md transition ${
                        isSel ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'
                      }`}
                    >
                      {dot} {b.company_name.split(' ')[0]}
                    </button>
                  );
                })}
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setIsAuditOpen(true)}
                  className="px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition flex items-center space-x-1"
                >
                  <span>📜 Audit Trail ({auditLogs.length})</span>
                </button>
                <button
                  onClick={handleReset}
                  disabled={loading}
                  className="px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition"
                >
                  🔄 Reset Demo
                </button>
              </div>
            </div>
          </header>

          {/* Floating Notice */}
          {notification && (
            <div className="fixed top-20 right-6 z-50 bg-blue-600 border border-blue-400 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center space-x-2">
              <span>✅ {notification}</span>
            </div>
          )}

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
            {/* KPI Cards */}
            {metrics && (
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                  <p className="text-[10px] font-bold text-slate-400 uppercase">Total Bidders</p>
                  <p className="text-xl font-black text-white">{metrics.total_bidders}</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                  <p className="text-[10px] font-bold text-emerald-400 uppercase">Fully Compliant</p>
                  <p className="text-xl font-black text-emerald-400">{metrics.compliant_count}</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                  <p className="text-[10px] font-bold text-amber-400 uppercase">Discrepancies</p>
                  <p className="text-xl font-black text-amber-400">{metrics.flagged_count}</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                  <p className="text-[10px] font-bold text-rose-400 uppercase">Debarred / Blocked</p>
                  <p className="text-xl font-black text-rose-400">{metrics.debarred_count}</p>
                </div>
                <div className="col-span-2 md:col-span-1 bg-gradient-to-r from-blue-950/40 to-indigo-950/40 border border-blue-800/40 p-3.5 rounded-xl">
                  <p className="text-[10px] font-bold text-blue-300 uppercase">Verification Time</p>
                  <p className="text-base font-black text-white font-mono">{metrics.automated_verification_time_sec}s <span className="text-xs text-slate-400 font-normal">vs 4.5d</span></p>
                </div>
              </div>
            )}

            {/* Bidders Queue Table */}
            <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow">
              <div className="p-3 bg-slate-950 border-b border-slate-800 flex justify-between items-center text-xs font-bold text-slate-300">
                <span>ACTIVE BIDDERS QUEUE</span>
                <span className="text-[10px] text-slate-500 font-mono">Select a bidder to inspect full dossier</span>
              </div>
              <div className="divide-y divide-slate-800">
                {bidders.map(b => {
                  const isSel = b.bidder_id === selectedId;
                  const score = b.compliance_score?.score ?? 0;
                  const risk = b.compliance_score?.risk_level ?? 'LOW';
                  return (
                    <div
                      key={b.bidder_id}
                      onClick={() => setSelectedId(b.bidder_id)}
                      className={`p-3.5 flex items-center justify-between cursor-pointer transition ${
                        isSel ? 'bg-blue-950/40 border-l-4 border-blue-500' : 'hover:bg-slate-850 bg-slate-900/60'
                      }`}
                    >
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-white text-sm">{b.company_name}</span>
                          <span className="text-[10px] px-1.5 py-0.5 bg-slate-800 text-slate-400 font-mono rounded">{b.bidder_id}</span>
                        </div>
                        <div className="text-xs text-slate-400 font-mono mt-1 space-x-3">
                          <span>GST: <strong className="text-slate-300">{b.identifiers.gstin}</strong></span>
                          <span>PAN: <strong className="text-slate-300">{b.identifiers.pan}</strong></span>
                          <span>State: <strong className="text-slate-300">{b.registered_state}</strong></span>
                        </div>
                      </div>

                      <div className="flex items-center space-x-4">
                        <div className="text-right">
                          <span className="text-sm font-black font-mono text-white">{score} <span className="text-[10px] text-slate-400">/ 100</span></span>
                          <span className={`ml-2 text-[10px] font-bold px-2 py-0.5 rounded ${
                            risk === 'LOW' ? 'bg-emerald-500/20 text-emerald-300' :
                            risk === 'CRITICAL' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'
                          }`}>{risk}</span>
                        </div>
                        <span className="text-xs font-bold bg-slate-800 text-slate-300 px-2 py-1 rounded">
                          {b.officer_status}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Selected Bidder Dossier */}
            {cur && (
              <div className="space-y-6">
                {/* Header Profile */}
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <div className="flex items-center space-x-2">
                      <h2 className="text-xl font-black text-white">{cur.company_name}</h2>
                      <span className="text-xs px-2 py-0.5 bg-blue-500/20 text-blue-300 rounded font-semibold">{cur.legal_structure}</span>
                    </div>
                    <p className="text-xs text-slate-400 font-mono mt-1">
                      Tender ID: {cur.tender_id} • MSME Udyam: {cur.identifiers.udyam_registration_number || 'N/A'} • Turnover: ₹{(cur.financials.annual_turnover_inr/10000000).toFixed(2)} Cr
                    </p>
                  </div>
                  <button
                    onClick={handleReverify}
                    disabled={verifying}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition shadow disabled:opacity-50"
                  >
                    {verifying ? 'Running Pipeline...' : '⚡ Re-Run 10-Step Verification'}
                  </button>
                </div>

                {/* Score & AI Synthesis Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* Gauge */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col items-center justify-center text-center">
                    <span className="text-xs font-bold uppercase text-slate-400 mb-2">Compliance Score</span>
                    <div className="w-28 h-28 rounded-full border-4 border-blue-500/40 flex flex-col items-center justify-center bg-slate-950">
                      <span className="text-3xl font-black text-white font-mono">{cur.compliance_score?.score}</span>
                      <span className="text-[10px] text-slate-400 uppercase">/ 100</span>
                    </div>
                    <span className={`mt-3 text-xs font-bold px-3 py-1 rounded-full uppercase ${
                      cur.compliance_score?.risk_level === 'LOW' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' :
                      cur.compliance_score?.risk_level === 'CRITICAL' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' :
                      'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                    }`}>
                      {cur.compliance_score?.risk_level} RISK
                    </span>
                  </div>

                  {/* AI Officer Assistant */}
                  <div className="md:col-span-2 bg-gradient-to-br from-indigo-950/40 via-slate-900 to-slate-900 border border-indigo-500/30 rounded-2xl p-5 space-y-3">
                    <div className="flex items-center justify-between pb-2 border-b border-indigo-900/40">
                      <span className="text-xs font-black text-indigo-300 uppercase tracking-wider flex items-center">
                        ✨ AI Procurement Officer Assistant
                      </span>
                      <span className="text-xs font-bold px-2 py-0.5 bg-indigo-500/20 text-indigo-200 rounded">
                        {cur.ai_recommendation?.recommended_action}
                      </span>
                    </div>
                    <p className="text-xs text-slate-200 leading-relaxed bg-slate-950/70 p-3 rounded-xl border border-slate-800">
                      {cur.ai_recommendation?.executive_summary}
                    </p>
                    {cur.ai_recommendation?.risk_factors?.length > 0 && (
                      <div className="space-y-1.5">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">Observations:</span>
                        {cur.ai_recommendation.risk_factors.map((rf, i) => (
                          <div key={i} className="text-xs p-2 rounded-lg bg-slate-950/80 border border-slate-800 flex justify-between items-center">
                            <span className="text-slate-300 font-medium">{rf.title}</span>
                            <span className="text-[9px] px-1.5 py-0.5 bg-black/40 rounded uppercase font-bold text-amber-300">{rf.severity}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* Tabs for Deep Dive */}
                <div className="space-y-4">
                  <div className="flex space-x-2 border-b border-slate-800 pb-2">
                    <button
                      onClick={() => setActiveTab('overview')}
                      className={`px-3 py-1.5 text-xs font-bold rounded-lg ${activeTab === 'overview' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}`}
                    >
                      Cross-Verification Diff ({cur.cross_check_mismatches?.length} Mismatches)
                    </button>
                    <button
                      onClick={() => setActiveTab('rules')}
                      className={`px-3 py-1.5 text-xs font-bold rounded-lg ${activeTab === 'rules' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400'}`}
                    >
                      Deterministic Rules Checklist ({cur.rule_results?.length})
                    </button>
                  </div>

                  {activeTab === 'overview' && (
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                      {cur.cross_check_mismatches?.length > 0 ? (
                        <div className="space-y-2">
                          {cur.cross_check_mismatches.map((m, i) => (
                            <div key={i} className="p-3 bg-amber-950/30 border border-amber-500/40 rounded-xl text-xs space-y-1">
                              <div className="flex justify-between font-bold text-amber-300">
                                <span>⚠️ {m.field_name}</span>
                                <span className="uppercase text-[10px]">{m.severity} RISK</span>
                              </div>
                              <p className="text-slate-300">{m.discrepancy_explanation}</p>
                              <div className="flex space-x-4 text-[11px] font-mono mt-1">
                                <span className="bg-slate-950 px-2 py-1 rounded">Doc: <strong className="text-rose-300">{String(m.source_a_value)}</strong></span>
                                <span className="bg-slate-950 px-2 py-1 rounded">Portal: <strong className="text-emerald-300">{String(m.source_b_value)}</strong></span>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="p-3 bg-emerald-950/20 border border-emerald-500/30 rounded-xl text-xs text-emerald-300">
                          ✅ Zero discrepancies! All uploaded certificate fields match live government records.
                        </div>
                      )}

                      {/* Side by Side Raw Data */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                        <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                          <span className="text-[10px] font-bold text-blue-400 uppercase">Uploaded Document Extraction (OCR)</span>
                          <pre className="text-[11px] font-mono text-slate-300 mt-2 whitespace-pre-wrap overflow-x-auto">
                            {JSON.stringify(cur.documents[0]?.extracted_fields || {}, null, 2)}
                          </pre>
                        </div>
                        <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                          <span className="text-[10px] font-bold text-emerald-400 uppercase">Live Registry Telemetry (API Setu)</span>
                          <pre className="text-[11px] font-mono text-slate-300 mt-2 whitespace-pre-wrap overflow-x-auto">
                            {JSON.stringify(cur.portal_verifications['GST_PORTAL']?.key_fields || {}, null, 2)}
                          </pre>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'rules' && (
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2.5">
                      {cur.rule_results?.map(r => (
                        <div key={r.rule_id} className={`p-3 rounded-xl border text-xs flex justify-between items-start ${
                          r.passed ? 'bg-slate-950 border-slate-800' : 'bg-rose-950/20 border-rose-500/40'
                        }`}>
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-bold text-white">{r.passed ? '✅' : '❌'} {r.rule_name}</span>
                              {r.is_hard_block && <span className="text-[9px] bg-rose-500/20 text-rose-300 px-1.5 py-0.2 rounded uppercase font-bold">Hard Gate</span>}
                            </div>
                            <p className="text-[11px] font-mono text-slate-400 mt-1">Expected: {r.expected_condition} | Actual: {String(r.actual_value)}</p>
                            {!r.passed && <p className="text-rose-300 mt-1">⚠️ {r.failure_reason}</p>}
                          </div>
                          <span className={`px-2 py-0.5 text-[10px] font-bold rounded uppercase ${r.passed ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>
                            {r.passed ? 'PASS' : 'FAIL'}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Step 9: Officer Decision Panel */}
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <div>
                      <h3 className="text-sm font-bold text-white uppercase">Procurement Officer Determination</h3>
                      <p className="text-xs text-slate-400">Step 9: Human-in-the-Loop decision workflow</p>
                    </div>
                    <span className="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-mono">
                      Current: {cur.officer_status}
                    </span>
                  </div>

                  <form onSubmit={handleDecisionSubmit} className="space-y-3">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                      {['APPROVE', 'REJECT', 'REQUEST_INFO', 'OVERRIDE'].map(act => (
                        <button
                          key={act}
                          type="button"
                          onClick={() => setActionType(act)}
                          className={`p-2.5 rounded-xl border text-xs font-bold transition ${
                            actionType === act ? 'bg-blue-600 border-blue-500 text-white shadow' : 'bg-slate-950 border-slate-800 text-slate-400'
                          }`}
                        >
                          {act === 'APPROVE' ? '✅ Approve' : act === 'REJECT' ? '❌ Reject' : act === 'REQUEST_INFO' ? '❓ Request Info' : '⚠️ Override Flags'}
                        </button>
                      ))}
                    </div>

                    {actionType === 'OVERRIDE' && (
                      <input
                        type="text"
                        required
                        placeholder="Mandatory CAG Audit Justification for override..."
                        value={overrideJustification}
                        onChange={e => setOverrideJustification(e.target.value)}
                        className="w-full bg-slate-950 border border-purple-600/50 rounded-xl p-2.5 text-xs text-white"
                      />
                    )}

                    <textarea
                      required
                      rows={2}
                      placeholder="Enter officer evaluation remarks..."
                      value={officerNotes}
                      onChange={e => setOfficerNotes(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white resize-none"
                    />

                    <div className="flex justify-between items-center pt-2">
                      <span className="text-[11px] text-slate-500 font-mono">Signed by: Rajesh Kumar (Officer ID: GEM-994)</span>
                      <button
                        type="submit"
                        disabled={verifying || !officerNotes.trim()}
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow disabled:opacity-50"
                      >
                        Commit Decision & Append Audit Log
                      </button>
                    </div>
                  </form>
                </div>

              </div>
            )}
          </main>

          {/* Audit Log Modal */}
          {isAuditOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex justify-end">
              <div className="w-full max-w-xl bg-slate-900 h-full p-6 overflow-y-auto space-y-4 border-l border-slate-800">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <span className="font-bold text-white text-sm uppercase">📜 GFR & CAG Compliance Audit Trail</span>
                  <button onClick={() => setIsAuditOpen(false)} className="text-slate-400 hover:text-white font-bold">✕ Close</button>
                </div>
                <div className="space-y-3">
                  {auditLogs.map(l => (
                    <div key={l.log_id} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                      <div className="flex justify-between font-bold text-slate-300">
                        <span className="text-blue-400">{l.actor}</span>
                        <span className="text-slate-500 font-mono">{new Date(l.timestamp).toLocaleTimeString()}</span>
                      </div>
                      <p className="font-semibold text-white">{l.step}: {l.action_type}</p>
                      {l.notes && <p className="text-indigo-300 bg-indigo-950/30 p-1.5 rounded">📝 {l.notes}</p>}
                      <pre className="text-[10px] font-mono text-slate-400 bg-slate-900 p-2 rounded overflow-x-auto">
                        {JSON.stringify(l.details, null, 2)}
                      </pre>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
