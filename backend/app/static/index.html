<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeM ProcureShield AI — Central Government Procurement Intelligence & Forensics Cockpit</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    
    .gem-tricolor-bar {
      background: linear-gradient(90deg, #FF9933 0%, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #138808 66.6%, #138808 100%);
      height: 4px;
    }
    
    .gem-header-gradient {
      background: linear-gradient(135deg, #051329 0%, #0A1E3F 60%, #0D2859 100%);
    }

    .bms-pill-active {
      background-color: #0B2559;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(11, 37, 89, 0.25);
    }
    
    .card-hover-lift {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.08);
    }

    @media print {
      body { background-color: #ffffff !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-900 selection:text-white">
  
  <!-- Tricolor National Stripe -->
  <div class="gem-tricolor-bar no-print"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      // Tenders & Bidders State
      const [tenders, setTenders] = useState([]);
      const [selectedTenderId, setSelectedTenderId] = useState('GEM/2026/B/89420');
      const [bidders, setBidders] = useState([]);
      const [expandedBidderId, setExpandedBidderId] = useState('BID-2026-0891');
      const [bidderTabMap, setBidderTabMap] = useState({});

      // Analytics & Logs State
      const [metrics, setMetrics] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [entityGraph, setEntityGraph] = useState(null);
      
      // UI Modals & Drawers State
      const [isAuditOpen, setIsAuditOpen] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [isForensicLabOpen, setIsForensicLabOpen] = useState(false);
      
      // Document Viewer & Full Report Modals
      const [previewBidder, setPreviewBidder] = useState(null);
      const [previewDocType, setPreviewDocType] = useState('GST_CERTIFICATE');
      const [previewDocData, setPreviewDocData] = useState(null);
      const [fullReportBidder, setFullReportBidder] = useState(null);

      const [loading, setLoading] = useState(true);
      const [verifyingId, setVerifyingId] = useState(null);
      const [notification, setNotification] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      // Enhanced Constraint Filters
      const [filterMinTrust, setFilterMinTrust] = useState(300);
      const [filterMinTurnover, setFilterMinTurnover] = useState(0);
      const [filterRiskProfile, setFilterRiskProfile] = useState('ALL'); // ALL | LOW | MEDIUM | CRITICAL
      const [filterMsmeOnly, setFilterMsmeOnly] = useState(false);
      const [filterTamperedOnly, setFilterTamperedOnly] = useState(false);
      const [filterExcludeConflicts, setFilterExcludeConflicts] = useState(false);

      // Live Forensic Upload Sandbox State
      const [forensicFile, setForensicFile] = useState(null);
      const [forensicClaimedDate, setForensicClaimedDate] = useState('2025-06-15');
      const [forensicUploading, setForensicUploading] = useState(false);
      const [liveForensicResult, setLiveForensicResult] = useState(null);
      const fileInputRef = useRef(null);

      // AI Chat State
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'ai',
          text: 'Namaste Officer! I am your GeM ProcureShield AI Intelligence Assistant.\n\nI have loaded all 3 active Government Tenders and 45 participating vendor dossiers. I can provide comparative technical evaluations, inspect ELA forensic tamper heatmaps, explain GFR 2017 rules, and analyze cartel networks.\n\nHow may I assist your Technical Evaluation Committee today?'
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      // Officer Decision State
      const [decisionAction, setDecisionAction] = useState('APPROVE');
      const [officerRemarks, setOfficerRemarks] = useState('');
      const [overrideJustification, setOverrideJustification] = useState('');

      const showNotice = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4500);
      };

      // Load Tenders and Initial Data
      const loadInitialData = async () => {
        try {
          setLoading(true);
          const [tRes, aRes] = await Promise.all([
            fetch('/api/tenders').then(r => r.json()),
            fetch('/api/audit').then(r => r.json())
          ]);
          setTenders(tRes);
          setAuditLogs(aRes);
          const initialTenderId = (tRes && tRes.length > 0) ? tRes[0].tender_id : selectedTenderId;
          if (initialTenderId) {
            setSelectedTenderId(initialTenderId);
            await loadTenderData(initialTenderId);
          }
        } catch (e) {
          console.error('Error loading initial data:', e);
        } finally {
          setLoading(false);
        }
      };

      // Load Bidders and Metrics for Selected Tender
      const loadTenderData = async (tenderId) => {
        try {
          const [bRes, mRes, gRes] = await Promise.all([
            fetch(`/api/bidders?tender_id=${encodeURIComponent(tenderId)}`).then(r => r.json()),
            fetch(`/api/metrics?tender_id=${encodeURIComponent(tenderId)}`).then(r => r.json()),
            fetch(`/api/graph/tender/${encodeURIComponent(tenderId)}`).then(r => r.json())
          ]);
          setBidders(bRes);
          setMetrics(mRes);
          setEntityGraph(gRes);
          if (bRes && bRes.length > 0) {
            setExpandedBidderId(bRes[0].bidder_id);
          }
        } catch (e) {
          console.error('Error loading tender data:', e);
        }
      };

      useEffect(() => {
        loadInitialData();
      }, []);

      useEffect(() => {
        if (selectedTenderId) {
          loadTenderData(selectedTenderId);
        }
      }, [selectedTenderId]);

      // Open Original Certificate Viewer
      const handleOpenDocViewer = async (bidder, docType = 'GST_CERTIFICATE') => {
        setPreviewBidder(bidder);
        setPreviewDocType(docType);
        try {
          const res = await fetch(`/api/documents/view/${bidder.bidder_id}?doc_type=${encodeURIComponent(docType)}`);
          const data = await res.json();
          setPreviewDocData(data);
        } catch (e) {
          console.error(e);
        }
      };

      // Re-run 10-step verification for a single bidder
      const handleReverify = async (bidderId) => {
        setVerifyingId(bidderId);
        try {
          await fetch(`/api/bidders/verify/${bidderId}`, { method: 'POST' });
          await loadTenderData(selectedTenderId);
          showNotice(`10-Step Automated Verification & Forensics Re-Evaluated for ${bidderId}!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifyingId(null);
        }
      };

      // Reset Demo Scenarios
      const handleReset = async () => {
        setLoading(true);
        try {
          await fetch('/api/bidders/reset-demo', { method: 'POST' });
          await loadInitialData();
          if (selectedTenderId) await loadTenderData(selectedTenderId);
          showNotice('All 3 Tenders & 45 Vendor Dossiers Reset Successfully!');
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Submit Procurement Officer Determination
      const handleDecisionSubmit = async (e, bidderId) => {
        e.preventDefault();
        if (!officerRemarks.trim()) return;
        setVerifyingId(bidderId);
        try {
          await fetch('/api/officer/decision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bidder_id: bidderId,
              action: decisionAction,
              officer_id: 'OFFICER-GEM-994',
              officer_name: 'Rajesh Kumar (Senior Procurement Director, GeM)',
              comments: officerRemarks,
              override_justification: overrideJustification
            })
          });
          setOfficerRemarks('');
          setOverrideJustification('');
          await loadTenderData(selectedTenderId);
          const aRes = await fetch('/api/audit').then(r => r.json());
          setAuditLogs(aRes);
          showNotice(`Determination (${decisionAction}) Committed & Signed on CAG Audit Trail!`);
        } catch (e) {
          console.error(e);
        } finally {
          setVerifyingId(null);
        }
      };

      // Live File Upload for ELA Forensic Scan
      const handleRunLiveForensicScan = async () => {
        if (!forensicFile) return;
        setForensicUploading(true);
        const formData = new FormData();
        formData.append('file', forensicFile);
        if (forensicClaimedDate) {
          formData.append('claimed_date', forensicClaimedDate);
        }

        try {
          const res = await fetch('/api/forensics/upload-test', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          setLiveForensicResult(data);
          showNotice(`Forensic ELA Scan Completed! Status: ${data.status} (Tamper Score: ${data.overall_tamper_score}/100)`);
        } catch (err) {
          console.error(err);
          showNotice('Error running live forensic scan.');
        } finally {
          setForensicUploading(false);
        }
      };

      // AI Chat Handler
      const handleSendChat = async (e) => {
        if (e) e.preventDefault();
        if (!chatInput.trim() || chatLoading) return;

        const userMsg = chatInput;
        setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat/officer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: userMsg,
              tender_id: selectedTenderId,
              active_bidder_id: expandedBidderId
            })
          });
          const data = await res.json();
          setChatMessages(prev => [...prev, {
            sender: 'ai',
            text: data.reply,
            context: data.context_used,
            suggested: data.suggested_actions
          }]);
        } catch (err) {
          setChatMessages(prev => [...prev, {
            sender: 'ai',
            text: 'I encountered an error querying the tender knowledge base. Please retry.'
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      // Toggle Vendor Accordion Expansion
      const toggleBidderAccordion = (bidderId) => {
        setExpandedBidderId(expandedBidderId === bidderId ? null : bidderId);
      };

      const setBidderTab = (bidderId, tab) => {
        setBidderTabMap(prev => ({ ...prev, [bidderId]: tab }));
      };
      const getBidderTab = (bidderId) => bidderTabMap[bidderId] || 'overview';

      // Active filter count computation
      const activeFilterCount = useMemo(() => {
        let count = 0;
        if (filterMinTrust > 300) count++;
        if (filterMinTurnover > 0) count++;
        if (filterRiskProfile !== 'ALL') count++;
        if (filterMsmeOnly) count++;
        if (filterTamperedOnly) count++;
        if (filterExcludeConflicts) count++;
        if (searchQuery.trim()) count++;
        return count;
      }, [filterMinTrust, filterMinTurnover, filterRiskProfile, filterMsmeOnly, filterTamperedOnly, filterExcludeConflicts, searchQuery]);

      // Reactive Filtered Bidders List
      const filteredBidders = useMemo(() => {
        return bidders.filter(b => {
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = b.company_name.toLowerCase().includes(q);
            const matchId = b.bidder_id.toLowerCase().includes(q);
            const matchGst = b.identifiers.gstin?.toLowerCase().includes(q);
            const matchState = b.registered_state?.toLowerCase().includes(q);
            if (!matchName && !matchId && !matchGst && !matchState) return false;
          }
          const trust = b.longitudinal_trust_score?.score ?? 0;
          if (trust < filterMinTrust) return false;

          const risk = b.compliance_score?.risk_level ?? 'LOW';
          if (filterRiskProfile !== 'ALL' && risk !== filterRiskProfile) return false;

          if (filterMinTurnover > 0 && b.financials.annual_turnover_inr < filterMinTurnover) return false;
          if (filterMsmeOnly && !b.identifiers.udyam_registration_number) return false;

          const firstDoc = b.documents?.[0];
          const tamperScore = firstDoc?.forensic_report?.overall_tamper_score ?? 0;
          if (filterTamperedOnly && tamperScore <= 25) return false;

          if (filterExcludeConflicts && b.conflict_links_count > 0) return false;

          return true;
        });
      }, [bidders, searchQuery, filterMinTrust, filterMinTurnover, filterRiskProfile, filterMsmeOnly, filterTamperedOnly, filterExcludeConflicts]);

      const currentTender = tenders.find(t => t.tender_id === selectedTenderId) || tenders[0];

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
          
          {/* GeM National Top Utility Bar */}
          <div className="bg-[#040E1E] text-slate-300 text-[11px] font-medium px-4 py-2 border-b border-slate-800 no-print">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
              <div className="flex items-center space-x-3">
                <span className="flex items-center space-x-1.5">
                  <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-white font-bold tracking-wide">Government of India</span>
                </span>
                <span className="text-slate-600">•</span>
                <span>Ministry of Commerce & Industry</span>
                <span className="text-slate-600">•</span>
                <span className="text-amber-400 font-bold">GeM ProcureShield AI Cockpit</span>
              </div>
              <div className="flex items-center space-x-4">
                <span className="font-mono text-slate-300">API Setu / GSTN / ELA Forensics Live</span>
                <span className="text-slate-600">|</span>
                <span>Security: <strong className="text-emerald-400 font-mono">CERT-In Level 4</strong></span>
              </div>
            </div>
          </div>

          {/* Main Top Header Navbar */}
          <header className="gem-header-gradient text-white sticky top-0 z-40 px-4 py-3.5 shadow-xl border-b border-blue-900/40 no-print">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* Brand Emblem & Logo */}
              <div className="flex items-center space-x-3.5">
                <div className="w-11 h-11 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center shadow-inner">
                  <span className="text-2xl">🏛️</span>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-extrabold text-xl tracking-tight text-white flex items-center gap-1.5">
                      GeM <span className="text-[#FF9933]">Procure</span><span className="text-[#38BDF8]">Shield</span>
                    </h1>
                    <span className="px-2.5 py-0.5 text-[10px] font-black bg-[#F84464] text-white rounded-full uppercase tracking-wider shadow">
                      3 BIDS • 45 VENDORS • ELA FORENSICS
                    </span>
                  </div>
                  <p className="text-xs text-blue-200/80 font-medium">
                    Technical Evaluation Committee AI Decision Cockpit & Digital Fraud Shield
                  </p>
                </div>
              </div>

              {/* Instant Search Bar */}
              <div className="hidden md:flex flex-1 max-w-md mx-4">
                <div className="relative w-full">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-blue-300 text-sm">
                    🔍
                  </span>
                  <input
                    type="text"
                    placeholder="Search 15 vendors by Name, GSTIN, State, or Bidder ID..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-white/10 border border-white/20 rounded-xl text-xs text-white placeholder-blue-200/60 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white/15 transition"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-blue-200 text-xs hover:text-white">
                      ✕
                    </button>
                  )}
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center space-x-2.5">
                
                {/* Forensic Lab Live Upload Button */}
                <button
                  onClick={() => setIsForensicLabOpen(true)}
                  className="px-3.5 py-2 text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl shadow-md transition flex items-center space-x-1.5 card-hover-lift"
                  title="Upload any real certificate to test ELA tamper detection"
                >
                  <span>🔬 Live Forensic Lab</span>
                  <span className="px-1.5 py-0.2 text-[9px] bg-black/20 text-slate-950 rounded font-black uppercase">Test</span>
                </button>

                {/* AI Assistant Button */}
                <button
                  onClick={() => setIsChatOpen(true)}
                  className="px-3.5 py-2 text-xs font-bold bg-[#F84464] hover:bg-[#d93b57] text-white rounded-xl shadow-md transition flex items-center space-x-1.5 card-hover-lift"
                >
                  <span>💬 AI Assistant</span>
                  <span className="w-2 h-2 rounded-full bg-white animate-ping"></span>
                </button>

                {/* Filter Drawer Toggle */}
                <button
                  onClick={() => setIsFilterOpen(!isFilterOpen)}
                  className={`px-3.5 py-2 text-xs font-bold rounded-xl border transition flex items-center space-x-1.5 ${
                    activeFilterCount > 0
                      ? 'bg-amber-500 text-slate-950 border-amber-400 font-extrabold shadow'
                      : 'bg-white/10 hover:bg-white/20 text-white border-white/20'
                  }`}
                >
                  <span>🎛️ Filters</span>
                  <span className="px-1.5 py-0.2 text-[10px] bg-black/30 rounded-full font-mono">
                    {filteredBidders.length} / {bidders.length}
                  </span>
                </button>

                {/* CAG Audit Log Modal */}
                <button
                  onClick={() => setIsAuditOpen(true)}
                  className="hidden sm:flex items-center space-x-1.5 px-3 py-2 text-xs font-bold bg-white/10 hover:bg-white/20 text-white rounded-xl border border-white/20 transition"
                >
                  <span>📜 CAG Audit</span>
                  <span className="px-1.5 py-0.2 text-[10px] bg-blue-900/80 rounded-full font-mono">
                    {auditLogs.length}
                  </span>
                </button>

                {/* Reset Data Button */}
                <button
                  onClick={handleReset}
                  disabled={loading}
                  className="p-2 text-xs bg-white/10 hover:bg-white/20 text-white rounded-xl border border-white/20 transition"
                  title="Reset Demo Scenarios"
                >
                  🔄
                </button>

              </div>
            </div>
          </header>

          {/* Floating Notice Toast */}
          {notification && (
            <div className="fixed top-20 right-6 z-50 bg-[#0B2559] border-2 border-amber-400 text-white px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center space-x-3 animate-bounce no-print">
              <span className="text-lg">🛡️</span>
              <span>{notification}</span>
            </div>
          )}

          {/* Main Layout Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-8">
            
            {/* STEP 1: OFFICIAL GeM TENDER / BID SELECTOR DECK */}
            <section className="space-y-3 no-print">
              <div className="flex justify-between items-center px-1">
                <div>
                  <span className="text-[10px] font-black uppercase tracking-wider text-blue-900 bg-blue-100 px-2.5 py-0.5 rounded-md">
                    STEP 1: SELECT CENTRAL GOVERNMENT TENDER
                  </span>
                  <h2 className="text-lg font-extrabold text-slate-900 mt-1">
                    Active Tenders Under Technical Evaluation ({tenders.length} Live Bids)
                  </h2>
                </div>
                <span className="text-xs text-slate-500 font-semibold">15 Participating Vendors Per Bid</span>
              </div>

              {/* 3 Interactive Tender Selection Cards */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {tenders.map(t => {
                  const isSel = t.tender_id === selectedTenderId;
                  return (
                    <div
                      key={t.tender_id}
                      onClick={() => setSelectedTenderId(t.tender_id)}
                      className={`relative bg-white rounded-2xl p-5 cursor-pointer border-2 transition-all card-hover-lift shadow-sm flex flex-col justify-between ${
                        isSel
                          ? 'border-[#0B2559] ring-2 ring-blue-600/20 shadow-md bg-blue-50/25'
                          : 'border-slate-200/90 hover:border-slate-300'
                      }`}
                    >
                      <div>
                        {/* Top Tender Badge */}
                        <div className="flex justify-between items-start mb-2.5">
                          <span className="px-2.5 py-0.5 text-[10px] font-extrabold bg-blue-100 text-blue-900 rounded font-mono">
                            {t.tender_id}
                          </span>
                          <span className="px-2 py-0.5 text-[10px] font-extrabold bg-emerald-100 text-emerald-800 rounded-full uppercase">
                            {t.status.replace('_', ' ')}
                          </span>
                        </div>

                        {/* Tender Title */}
                        <h3 className="text-sm font-extrabold text-slate-900 leading-snug line-clamp-2">
                          {t.title}
                        </h3>
                        
                        {/* Ministry & Category */}
                        <p className="text-xs text-slate-500 mt-1.5 font-medium">
                          {t.ministry} • <span className="text-slate-700 font-semibold">{t.category}</span>
                        </p>
                      </div>

                      <div>
                        {/* Financial & Bid Stats */}
                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold uppercase block">Sanctioned Value</span>
                            <span className="text-base font-black font-mono text-emerald-700">₹{t.estimated_value_cr.toFixed(2)} Cr</span>
                          </div>
                          <div className="text-right">
                            <span className="text-[10px] text-slate-400 font-bold uppercase block">Vendors Ingested</span>
                            <span className="text-sm font-black font-mono text-[#0B2559]">15 Dossiers</span>
                          </div>
                        </div>

                        {/* Active Selector Pill */}
                        {isSel && (
                          <div className="mt-3 pt-2.5 border-t border-blue-200/60 flex items-center justify-between text-xs font-extrabold text-[#0B2559]">
                            <span>Active Evaluation Roster</span>
                            <span>Selected ✓</span>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Active Tender Header Banner */}
            {currentTender && (

                      {/* Heatmap Display */}
                      <div className="bg-slate-900 p-4 rounded-2xl text-white space-y-2">
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-bold text-amber-400 uppercase">🔥 Live Generated Error Level Analysis (ELA) Heatmap</span>
                          <span className="text-[10px] text-slate-400 font-mono">Q90 Compression Delta</span>
                        </div>
                        {liveForensicResult.ela_heatmap_base64 && (
                          <div className="rounded-xl overflow-hidden bg-black flex items-center justify-center p-2 border border-slate-700">
                            <img
                              src={liveForensicResult.ela_heatmap_base64}
                              alt="Live ELA Heatmap"
                              className="max-h-72 object-contain rounded w-full"
                            />
                          </div>
                        )}
                      </div>

                      {/* Metadata flags */}
                      <div className="p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1.5">
                        <span className="font-bold text-slate-700 uppercase text-[10px]">Metadata & EXIF Observations:</span>
                        {liveForensicResult.metadata_analysis?.flags?.map((fl, idx) => (
                          <div key={idx} className="text-slate-600 bg-white p-2 rounded border border-slate-200">
                            • {fl}
                          </div>
                        ))}
                      </div>

                    </div>
                  )}

                </div>

                {/* Footer */}
                <div className="p-4 bg-slate-100 border-t border-slate-200 text-right">
                  <button
                    onClick={() => setIsForensicLabOpen(false)}
                    className="px-5 py-2 bg-[#0B2559] hover:bg-[#07183a] text-white text-xs font-bold rounded-xl transition shadow"
                  >
                    Close Forensic Lab
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* AI Officer Chat Assistant Slide-Over Drawer */}
          {isChatOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex justify-end no-print">
              <div className="w-full max-w-xl bg-white h-full flex flex-col shadow-2xl border-l border-slate-200 animate-slideLeft">
                
                {/* Chat Header */}
                <div className="p-4 bg-[#0B2559] text-white flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <span className="text-2xl">🤖</span>
                    <div>
                      <h3 className="text-sm font-extrabold uppercase">GeM AI Intelligence Officer Assistant</h3>
                      <p className="text-[11px] text-blue-200">Dynamic Multi-Vendor Reasoning & GFR 2017 Advisory</p>
                    </div>
                  </div>
                  <button onClick={() => setIsChatOpen(false)} className="text-white hover:text-amber-400 font-bold text-lg p-1">✕</button>
                </div>

                {/* Chat Messages Stream */}
                <div className="flex-1 p-5 overflow-y-auto space-y-4 bg-[#F8FAFC]">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div className={`p-4 rounded-2xl max-w-[92%] text-xs leading-relaxed ${
                        msg.sender === 'user'
                          ? 'bg-[#0B2559] text-white rounded-br-none shadow-sm'
                          : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none shadow-sm'
                      }`}>
                        <div className="whitespace-pre-wrap">{msg.text}</div>

                        {msg.suggested && (
                          <div className="mt-3 pt-2 border-t border-slate-200 space-y-1">
                            <span className="text-[10px] text-slate-500 uppercase font-bold block">Recommended Next Actions:</span>
                            {msg.suggested.map((s, i) => (
                              <button
                                key={i}
                                onClick={() => { setChatInput(s); }}
                                className="block text-left text-xs text-blue-700 hover:text-blue-900 font-semibold"
                              >
                                → {s}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                  {chatLoading && (
                    <div className="text-xs text-slate-500 flex items-center space-x-2 p-3 bg-white rounded-xl border border-slate-200 w-fit">
                      <span className="animate-spin">⚡</span>
                      <span>AI Procurement Engine is analyzing tender dossiers & statutory registers...</span>
                    </div>
                  )}
                </div>

                {/* Chat Input */}
                <form onSubmit={handleSendChat} className="p-4 bg-white border-t border-slate-200 flex gap-2">
                  <input
                    type="text"
                    placeholder="Ask comparative questions, ELA forensic flags, cartel links, or GFR rules..."
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    className="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600"
                  />
                  <button
                    type="submit"
                    disabled={chatLoading || !chatInput.trim()}
                    className="px-5 py-2.5 bg-[#F84464] hover:bg-[#d93b57] text-white text-xs font-bold rounded-xl disabled:opacity-50 shadow-sm"
                  >
                    Send
                  </button>
                </form>

              </div>
            </div>
          )}

          {/* CAG Compliance Audit Trail Modal */}
          {isAuditOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex justify-end no-print">
              <div className="w-full max-w-xl bg-white h-full p-6 overflow-y-auto space-y-4 border-l border-slate-200 shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <div>
                    <span className="font-black text-slate-800 text-sm uppercase">📜 GFR 2017 & CAG Compliance Audit Trail</span>
                    <p className="text-xs text-slate-500">Immutable SHA-256 state tracking across all tenders</p>
                  </div>
                  <button onClick={() => setIsAuditOpen(false)} className="text-slate-400 hover:text-slate-800 font-bold text-lg">✕</button>
                </div>
                <div className="space-y-3">
                  {auditLogs.map(l => (
                    <div key={l.log_id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-1.5">
                      <div className="flex justify-between font-bold text-slate-700">
                        <span className="text-[#0B2559]">{l.actor}</span>
                        <span className="text-slate-400 font-mono text-[11px]">{new Date(l.timestamp).toLocaleTimeString()}</span>
                      </div>
                      <p className="font-extrabold text-slate-900">{l.step}: {l.action_type}</p>
                      {l.notes && <p className="text-blue-900 bg-blue-50 p-2 rounded-lg border border-blue-100 font-medium">📝 {l.notes}</p>}
                      <pre className="text-[11px] font-mono text-slate-600 bg-white p-2.5 rounded-lg border border-slate-200 overflow-x-auto">
                        {JSON.stringify(l.details, null, 2)}
                      </pre>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#040E1E] text-slate-400 text-xs py-6 border-t border-slate-800 mt-12 no-print">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-2">
                <span className="text-lg">🇮🇳</span>
                <span>Government e-Marketplace (GeM) • Multi-Bid ProcureShield AI Engine</span>
              </div>
              <div className="flex items-center space-x-4 text-[11px]">
                <span>GFR 2017 Verified</span>
                <span>•</span>
                <span>ELA Forensics Active</span>
                <span>•</span>
                <span>CVC Guidelines Adherent</span>
                <span>•</span>
                <span>CAG Audit Ready</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
