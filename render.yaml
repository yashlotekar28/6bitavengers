services:
  # ProcureShield AI Web Service (FastAPI + Static Dashboard)
  - type: web
    name: procureshield-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
